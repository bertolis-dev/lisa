<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Lisa — tout le programme de spécialité mathématiques de première, avec des exercices tirés au sort et corrigés pas à pas.">
<meta name="theme-color" content="#16223F">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png" sizes="192x192">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Lisa">
<style>*,*::before,*::after{box-sizing:border-box}html,body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<title>Lisa</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Spectral:ital,wght@0,400;0,600;0,700;1,400;1,600&family=Karla:wght@400;500;600;700&family=JetBrains+Mono:wght@400;700&display=swap">
<style>
/* ---------- tokens ---------- */
:root{
  --serif:"Spectral", Georgia, "Times New Roman", serif;
  --sans:"Karla", "Segoe UI", system-ui, sans-serif;
  --mono:"JetBrains Mono", Consolas, monospace;

  --paper:#EDF0F5;
  --surface:#FFFFFF;
  --surface-2:#F5F7FB;
  --surface-3:#E7ECF4;
  --ink:#16223F;
  --ink-2:#525F7E;
  --ink-3:#8590A8;
  --line:#D8DFEA;
  --line-soft:#E6EBF3;

  --accent:#2F45C5;
  --accent-soft:#E6E9FA;
  --accent-ink:#2536A0;

  --amber:#A8710A;
  --amber-soft:#FBEFD8;
  --juste:#0F7A54;
  --juste-soft:#DDF1E8;
  --faux:#B02F28;
  --faux-soft:#FAE4E2;

  --grid:rgba(47,69,197,.07);
  --shadow:0 1px 2px rgba(22,34,63,.05), 0 8px 24px -12px rgba(22,34,63,.18);
  --r:10px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#0E1424;
    --surface:#161E33;
    --surface-2:#1C2540;
    --surface-3:#26304E;
    --ink:#E6EBF6;
    --ink-2:#A3AFC9;
    --ink-3:#7A87A4;
    --line:#2E3958;
    --line-soft:#232C47;
    --accent:#8296FF;
    --accent-soft:#232F63;
    --accent-ink:#A9B7FF;
    --amber:#E0A84B;
    --amber-soft:#3A2D14;
    --juste:#54C79A;
    --juste-soft:#123529;
    --faux:#F08A82;
    --faux-soft:#3A1C1A;
    --grid:rgba(130,150,255,.08);
    --shadow:0 1px 2px rgba(0,0,0,.3), 0 10px 30px -14px rgba(0,0,0,.7);
  }
}
:root[data-theme="dark"]{
  --paper:#0E1424; --surface:#161E33; --surface-2:#1C2540; --surface-3:#26304E;
  --ink:#E6EBF6; --ink-2:#A3AFC9; --ink-3:#7A87A4; --line:#2E3958; --line-soft:#232C47;
  --accent:#8296FF; --accent-soft:#232F63; --accent-ink:#A9B7FF;
  --amber:#E0A84B; --amber-soft:#3A2D14; --juste:#54C79A; --juste-soft:#123529;
  --faux:#F08A82; --faux-soft:#3A1C1A; --grid:rgba(130,150,255,.08);
  --shadow:0 1px 2px rgba(0,0,0,.3), 0 10px 30px -14px rgba(0,0,0,.7);
}

*,*::before,*::after{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font-family:var(--sans);line-height:1.55;-webkit-font-smoothing:antialiased}
h1,h2,h3,h4{font-family:var(--serif);font-weight:600;line-height:1.22;text-wrap:balance;margin:0}
p{margin:0}
button{font:inherit;color:inherit;cursor:pointer;border:none;background:none}
input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}

/* ---------- notation mathématique ---------- */
.m{font-family:var(--serif);font-size:1.06em}
.m i{font-style:italic}
.frac{display:inline-flex;flex-direction:column;vertical-align:-0.45em;text-align:center;font-size:.9em;line-height:1.18}
.frac>.n{padding:0 .3em;border-bottom:1px solid currentColor}
.frac>.d{padding:0 .3em}
.sqrt>.rad{border-top:1px solid currentColor;padding:0 .15em 0 .06em;margin-left:-.06em}
.vec{position:relative;display:inline-block}
.vec>.arw{position:absolute;top:-.8em;left:0;right:0;font-size:.6em;text-align:center;font-style:normal;line-height:1}
code,.code{font-family:var(--mono);font-size:.88em}
pre.code{background:var(--surface-2);border:1px solid var(--line-soft);border-radius:var(--r);padding:14px 16px;overflow-x:auto;line-height:1.6;margin:0}

/* ---------- structure ---------- */
.app{display:grid;grid-template-columns:272px minmax(0,1fr);min-height:100vh}
.side{background:var(--surface);border-right:1px solid var(--line);display:flex;flex-direction:column;position:sticky;top:0;height:100vh;overflow-y:auto}
.brand{padding:20px 20px 16px;border-bottom:1px solid var(--line-soft);
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:22px 22px}
.brand h1{font-size:19px;letter-spacing:-.01em}
.brand .sub{font-size:11px;color:var(--ink-3);text-transform:uppercase;letter-spacing:.09em;font-weight:700;margin-top:4px}
.nav{padding:8px 10px 28px;display:flex;flex-direction:column;gap:2px}
.nav .grp{font-size:10.5px;text-transform:uppercase;letter-spacing:.1em;color:var(--ink-3);font-weight:700;padding:16px 10px 6px}
.nav button{display:flex;align-items:center;gap:9px;width:100%;text-align:left;padding:7px 10px;border-radius:7px;font-size:14px;color:var(--ink-2);transition:background .12s,color .12s}
.nav button:hover{background:var(--surface-2);color:var(--ink)}
.nav button.on{background:var(--accent-soft);color:var(--accent-ink);font-weight:600}
.nav .dot{width:7px;height:7px;border-radius:50%;flex:0 0 auto;background:transparent;border:1.5px solid var(--line)}
.nav .dot.vu{background:var(--amber);border-color:var(--amber)}
.nav .dot.fini{background:var(--juste);border-color:var(--juste)}
.nav .meta{margin-left:auto;font-size:11px;color:var(--ink-3);font-variant-numeric:tabular-nums;flex:0 0 auto}
main{min-width:0;padding-block:34px;padding-left:40px;padding-right:40px;max-width:1080px;width:100%}
.topbar{display:none}

@media (max-width:900px){
  .app{grid-template-columns:1fr}
  .side{position:fixed;inset:0 auto 0 0;width:min(300px,86vw);z-index:40;transform:translateX(-102%);transition:transform .22s ease;box-shadow:var(--shadow)}
  .side.open{transform:none}
  .scrim{position:fixed;inset:0;background:rgba(10,15,30,.45);z-index:35}
  .topbar{display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:20;background:var(--surface);border-bottom:1px solid var(--line);padding:10px 16px}
  .topbar h1{font-size:16px}
  main{padding-left:16px;padding-right:16px;padding-block:22px}
}

/* ---------- éléments ---------- */
.eyebrow{font-size:11px;text-transform:uppercase;letter-spacing:.12em;font-weight:700;color:var(--accent);margin-bottom:8px}
.lede{color:var(--ink-2);font-size:15px;max-width:64ch}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:10px 18px;border-radius:8px;font-weight:600;font-size:14.5px;background:var(--surface-2);border:1px solid var(--line);transition:background .12s,border-color .12s,transform .08s}
.btn:hover{background:var(--surface-3)}
.btn:active{transform:translateY(1px)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.primary:hover{filter:brightness(1.08)}
:root[data-theme="dark"] .btn.primary{color:#0E1424}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .btn.primary{color:#0E1424}}
.btn.ghost{background:transparent}
.btn.sm{padding:6px 12px;font-size:13px;border-radius:7px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:11px;font-weight:700;letter-spacing:.05em;padding:3px 9px;border-radius:999px;text-transform:uppercase}
.pill.neuf{background:var(--surface-3);color:var(--ink-2)}
.pill.vu{background:var(--amber-soft);color:var(--amber)}
.pill.fini{background:var(--juste-soft);color:var(--juste)}
.pill.soon{background:var(--surface-3);color:var(--ink-3)}
.bar{height:5px;border-radius:999px;background:var(--surface-3);overflow:hidden}
.bar>span{display:block;height:100%;background:var(--accent);border-radius:999px;transition:width .3s}
.bar.g>span{background:var(--juste)}
.mut{color:var(--ink-2)}
.tiny{font-size:12.5px;color:var(--ink-3)}

/* ---------- accueil ---------- */
.home-head{display:flex;flex-wrap:wrap;gap:20px;align-items:flex-end;justify-content:space-between;margin-bottom:26px}
.encours{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:18px;align-items:center;background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--accent);border-radius:var(--r);padding:18px 20px;margin-bottom:14px}
.modes{display:grid;grid-template-columns:repeat(auto-fit,minmax(215px,1fr));gap:12px;margin-bottom:30px}
.mode{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;text-align:left;display:flex;flex-direction:column;gap:5px;transition:border-color .12s,transform .1s}
.mode:hover{border-color:var(--accent);transform:translateY(-1px)}
.mode b{font-family:var(--serif);font-size:16.5px;font-weight:600}
.mode span{font-size:13px;color:var(--ink-2);line-height:1.45}
.mode[disabled]{opacity:.5}
.mode[disabled]:hover{border-color:var(--line);transform:none}
.blocs{display:flex;flex-direction:column;gap:26px}
.bloc h3{font-size:13px;text-transform:uppercase;letter-spacing:.1em;color:var(--ink-3);font-family:var(--sans);font-weight:700;margin-bottom:10px;padding-bottom:8px;border-bottom:1px solid var(--line)}
.chaps{display:grid;grid-template-columns:repeat(auto-fill,minmax(258px,1fr));gap:10px}
.chap{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;text-align:left;display:flex;flex-direction:column;gap:9px;transition:border-color .12s,transform .1s}
.chap:hover{border-color:var(--accent);transform:translateY(-1px)}
.chap .t{font-family:var(--serif);font-size:16px;font-weight:600;line-height:1.25}
.chap .row{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:auto}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;margin-bottom:26px}
.stat{background:var(--surface);padding:14px 16px}
.stat .v{font-family:var(--serif);font-size:26px;font-weight:600;font-variant-numeric:tabular-nums;line-height:1.1}
.stat .k{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--ink-3);font-weight:700;margin-top:2px}

/* ---------- chapitre ---------- */
.chead{margin-bottom:22px}
.chead h2{font-size:29px;margin:6px 0 10px}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:22px;overflow-x:auto}
.tabs button{padding:9px 14px;font-size:14px;font-weight:600;color:var(--ink-3);border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap}
.tabs button.on{color:var(--accent);border-bottom-color:var(--accent)}
.capa{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px 20px;margin-bottom:18px}
.capa ul{margin:10px 0 0;padding-left:20px;display:flex;flex-direction:column;gap:6px;font-size:14.5px;color:var(--ink-2)}
.cours{display:flex;flex-direction:column;gap:14px}
.blk{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px}
.blk.def{border-left:3px solid var(--accent)}
.blk.prop{border-left:3px solid var(--juste)}
.blk.meth{border-left:3px solid var(--amber)}
.blk.piege{border-left:3px solid var(--faux);background:var(--surface)}
.blk .h{display:flex;align-items:center;gap:9px;margin-bottom:8px}
.blk .h .k{font-size:10.5px;text-transform:uppercase;letter-spacing:.1em;font-weight:700}
.blk.def .h .k{color:var(--accent)} .blk.prop .h .k{color:var(--juste)}
.blk.meth .h .k{color:var(--amber)} .blk.piege .h .k{color:var(--faux)}
.blk .h b{font-family:var(--serif);font-size:16.5px;font-weight:600}
.blk .body{font-size:14.8px;color:var(--ink-2);display:flex;flex-direction:column;gap:9px}
.blk .body b,.blk .body strong{color:var(--ink)}
.blk .body ul{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:5px}
.center{text-align:center;color:var(--ink);padding:4px 0}
.niveaux{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.niv{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;text-align:left;display:flex;flex-direction:column;gap:4px}
.niv:hover{border-color:var(--accent)}
.niv b{font-family:var(--serif);font-size:16px;font-weight:600}
.niv span{font-size:12.5px;color:var(--ink-2)}
.methods{display:flex;flex-direction:column;gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.mrow{display:grid;grid-template-columns:minmax(0,1fr) 92px 68px;gap:12px;align-items:center;background:var(--surface);padding:11px 16px;font-size:14px}
.mrow .lbl{min-width:0}
.mrow .sc{font-variant-numeric:tabular-nums;font-size:13px;color:var(--ink-2);text-align:right}

/* ---------- exercices ---------- */
.run{max-width:760px;margin:0 auto}
.runtop{display:flex;align-items:center;justify-content:space-between;gap:14px;margin-bottom:18px}
.dots{display:flex;gap:5px;flex-wrap:wrap}
.dots i{width:9px;height:9px;border-radius:50%;background:var(--surface-3);border:1px solid var(--line);display:block}
.dots i.ok{background:var(--juste);border-color:var(--juste)}
.dots i.ko{background:var(--faux);border-color:var(--faux)}
.dots i.now{background:var(--accent);border-color:var(--accent);transform:scale(1.25)}
.qcard{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:24px;box-shadow:var(--shadow)}
.qmeta{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.qtext{font-size:17px;line-height:1.6;display:flex;flex-direction:column;gap:10px}
.qtext .m{font-size:1.12em}
.fields{display:flex;flex-direction:column;gap:12px;margin-top:20px}
.field{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.field label{font-size:14.5px;color:var(--ink-2);min-width:140px}
.field input{padding:9px 12px;border:1px solid var(--line);border-radius:8px;background:var(--surface-2);width:150px;font-size:15px;font-variant-numeric:tabular-nums}
.field input:focus{outline:2px solid var(--accent);outline-offset:0;border-color:var(--accent)}
.choices{display:flex;flex-direction:column;gap:8px;margin-top:18px}
.choice{display:flex;align-items:center;gap:11px;padding:12px 14px;border:1px solid var(--line);border-radius:8px;background:var(--surface-2);text-align:left;font-size:15px;transition:border-color .1s,background .1s}
.choice:hover{border-color:var(--accent)}
.choice.sel{border-color:var(--accent);background:var(--accent-soft)}
.choice .k{width:22px;height:22px;flex:0 0 auto;border-radius:50%;border:1px solid var(--line);display:grid;place-items:center;font-size:12px;font-weight:700;color:var(--ink-3);background:var(--surface)}
.choice.sel .k{background:var(--accent);border-color:var(--accent);color:#fff}
.choice.good{border-color:var(--juste);background:var(--juste-soft)}
.choice.bad{border-color:var(--faux);background:var(--faux-soft)}
.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:22px}
.verdict{margin-top:20px;border-radius:var(--r);padding:16px 18px;border:1px solid}
.verdict.ok{background:var(--juste-soft);border-color:var(--juste)}
.verdict.ko{background:var(--faux-soft);border-color:var(--faux)}
.verdict .vh{font-family:var(--serif);font-size:17px;font-weight:600;display:flex;align-items:center;gap:8px}
.verdict.ok .vh{color:var(--juste)} .verdict.ko .vh{color:var(--faux)}
.verdict .vb{margin-top:6px;font-size:14.5px;color:var(--ink-2)}
.sol{margin-top:16px;background:var(--surface-2);border:1px solid var(--line-soft);border-radius:var(--r);padding:18px}
.sol h4{font-size:12px;text-transform:uppercase;letter-spacing:.1em;color:var(--ink-3);font-family:var(--sans);font-weight:700;margin-bottom:12px}
.steps{display:flex;flex-direction:column;gap:12px;counter-reset:st}
.step{display:grid;grid-template-columns:24px minmax(0,1fr);gap:11px;font-size:14.8px;color:var(--ink-2);line-height:1.6}
.step::before{counter-increment:st;content:counter(st);width:24px;height:24px;border-radius:50%;background:var(--surface-3);color:var(--ink-3);font-size:11.5px;font-weight:700;display:grid;place-items:center;font-family:var(--sans)}
.step .m{color:var(--ink);font-size:1.08em}
.step b{color:var(--ink)}
.bilan{text-align:center;padding:34px 24px}
.bilan .score{font-family:var(--serif);font-size:56px;font-weight:600;line-height:1;font-variant-numeric:tabular-nums}
.bilan .sur{font-size:24px;color:var(--ink-3)}
.timer{font-variant-numeric:tabular-nums;font-weight:700;font-size:15px;padding:5px 11px;border-radius:7px;background:var(--surface-3)}
.timer.warn{background:var(--faux-soft);color:var(--faux)}
.empty{text-align:center;padding:44px 20px;color:var(--ink-2);background:var(--surface);border:1px dashed var(--line);border-radius:var(--r)}
.revue{display:flex;flex-direction:column;gap:8px}
.rev{display:flex;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--line);border-left:3px solid var(--amber);border-radius:var(--r);padding:12px 16px;font-size:14.5px}
.rev .ch{font-size:12px;color:var(--ink-3);margin-left:auto;white-space:nowrap}
/* ---------- une couleur par domaine ---------- */
[data-bloc]{--bc:var(--accent);--bcs:var(--accent-soft)}
[data-bloc="algebre"]   {--bc:#6D4AC9;--bcs:#EEE8FC}
[data-bloc="analyse"]   {--bc:#2F6FE0;--bcs:#E4EDFC}
[data-bloc="geometrie"] {--bc:#0F8A5F;--bcs:#DDF2EA}
[data-bloc="probas"]    {--bc:#C4700A;--bcs:#FBEEDA}
[data-bloc="transverse"]{--bc:#BC3B84;--bcs:#FBE5F1}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]) [data-bloc="algebre"]   {--bc:#B49BFF;--bcs:#2C2350}
  :root:not([data-theme="light"]) [data-bloc="analyse"]   {--bc:#7FB0FF;--bcs:#1B2C4E}
  :root:not([data-theme="light"]) [data-bloc="geometrie"] {--bc:#4FD1A0;--bcs:#12352C}
  :root:not([data-theme="light"]) [data-bloc="probas"]    {--bc:#F0A94C;--bcs:#3A2A12}
  :root:not([data-theme="light"]) [data-bloc="transverse"]{--bc:#F183BC;--bcs:#3B1C30}
}
:root[data-theme="dark"] [data-bloc="algebre"]   {--bc:#B49BFF;--bcs:#2C2350}
:root[data-theme="dark"] [data-bloc="analyse"]   {--bc:#7FB0FF;--bcs:#1B2C4E}
:root[data-theme="dark"] [data-bloc="geometrie"] {--bc:#4FD1A0;--bcs:#12352C}
:root[data-theme="dark"] [data-bloc="probas"]    {--bc:#F0A94C;--bcs:#3A2A12}
:root[data-theme="dark"] [data-bloc="transverse"]{--bc:#F183BC;--bcs:#3B1C30}

.nav .grp[data-bloc]{color:var(--bc)}
.bloc[data-bloc] h3{color:var(--bc);border-bottom-color:var(--bc);border-bottom-width:2px}
.chap[data-bloc]{border-top:3px solid var(--bc)}
.chap[data-bloc]:hover{border-color:var(--line);border-top-color:var(--bc);box-shadow:0 6px 18px -10px var(--bc)}
.chead[data-bloc] .eyebrow{color:var(--bc)}
.chead[data-bloc] h2{color:var(--bc)}
.qcard[data-bloc]{border-top:4px solid var(--bc)}
.qcard[data-bloc] .pill.neuf{background:var(--bcs);color:var(--bc)}
.chap-rank .niv-dots i.on{background:var(--bc)}
.nav button[data-bloc] .dot.fini{background:var(--bc);border-color:var(--bc)}

/* ---------- ruban des matières ---------- */
.ruban{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;margin-bottom:22px;scrollbar-width:thin}
.mat{display:flex;align-items:center;gap:7px;flex:0 0 auto;padding:8px 14px;border-radius:999px;
  border:1px solid var(--line);background:var(--surface);font-size:13.5px;color:var(--ink-2);transition:all .12s}
.mat:hover{border-color:var(--accent);color:var(--ink)}
.mat b{font-weight:600}
.mat .me{font-size:16px;line-height:1}
.mat.on{background:var(--accent);border-color:var(--accent);color:#fff}
:root[data-theme="dark"] .mat.on{color:#0E1424}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .mat.on{color:#0E1424}}
.mat.futur{opacity:.6}
.mat .mb{font-size:9.5px;text-transform:uppercase;letter-spacing:.07em;font-weight:700;color:var(--amber);
  background:var(--amber-soft);padding:2px 6px;border-radius:999px}
.mat.plus{border-style:dashed;color:var(--ink-3)}
.matcard{display:flex;align-items:center;gap:12px;text-align:left;width:100%;
  background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:13px 15px;transition:border-color .12s}
.matcard:hover{border-color:var(--accent)}
.matcard.prise{border-color:var(--juste);background:var(--juste-soft)}
.matcard .me{font-size:24px;line-height:1;flex:0 0 auto}
.matcard .mn{display:flex;flex-direction:column;gap:1px;min-width:0}
.matcard .mn b{font-family:var(--serif);font-size:15px;font-weight:600;line-height:1.25}
.matcard .mk{margin-left:auto;font-weight:700;color:var(--juste);font-size:16px;flex:0 0 auto}
.nav-mat{font-size:12.5px;font-weight:700;color:var(--ink-2);padding:10px 10px 2px;display:flex;gap:6px;align-items:center}

/* ---------- objectif du jour ---------- */
.jour{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:18px;align-items:center;
  background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 20px;margin-bottom:14px}
.anneau{width:74px;height:74px;flex:0 0 auto}
.anneau .piste{fill:none;stroke:var(--surface-3);stroke-width:8}
.anneau .jauge{fill:none;stroke:var(--juste);stroke-width:8;stroke-linecap:round;transform:rotate(-90deg);transform-origin:50% 50%;transition:stroke-dashoffset .6s ease}
.anneau-t{font-family:var(--sans);font-size:19px;font-weight:700;fill:var(--ink);font-variant-numeric:tabular-nums}
.jour-txt{display:flex;flex-direction:column;gap:2px;min-width:0}
.jour-txt b{font-family:var(--serif);font-size:17px;font-weight:600}
.jour-txt span{font-size:13.5px;color:var(--ink-2)}
.flamme{display:flex;flex-direction:column;align-items:center;gap:0;opacity:.35;flex:0 0 auto}
.flamme.on{opacity:1}
.flamme .f{font-size:22px;line-height:1}
.flamme b{font-family:var(--serif);font-size:22px;font-weight:600;line-height:1.1}
.flamme .j{font-size:10.5px;color:var(--ink-3);text-transform:uppercase;letter-spacing:.06em;font-weight:700}
.sr-jours{font-size:11.5px;color:var(--amber);font-weight:700;margin-top:7px}
.son{font-size:14px;line-height:1;padding:2px 4px;border-radius:6px;opacity:.75}
.son:hover{opacity:1;background:var(--surface-2)}
.side-rank .sr-top{align-items:center}

/* ---------- badges ---------- */
.titre-sec{display:flex;align-items:baseline;gap:10px;font-size:13px;text-transform:uppercase;letter-spacing:.1em;
  color:var(--ink-3);font-weight:700;margin:4px 0 10px}
.titre-sec span{font-size:12px;letter-spacing:0;color:var(--accent);font-weight:700;text-transform:none;
  background:var(--accent-soft);padding:2px 9px;border-radius:999px}
.badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(148px,1fr));gap:8px;margin-bottom:28px}
.badge{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 12px 11px;
  display:flex;flex-direction:column;align-items:center;text-align:center;gap:3px;opacity:.55;filter:grayscale(1)}
.badge.eu{opacity:1;filter:none;border-color:var(--amber);background:linear-gradient(180deg,var(--amber-soft),var(--surface) 62%)}
.badge .be{font-size:26px;line-height:1.1}
.badge b{font-size:13px;font-family:var(--serif);font-weight:600}
.badge .bd{font-size:11px;color:var(--ink-3);line-height:1.35}

/* ---------- célébrations ---------- */
.confettis{position:fixed;inset:0;pointer-events:none;z-index:120}
.toast{position:fixed;left:50%;bottom:26px;transform:translate(-50%,120%);z-index:130;
  display:flex;align-items:center;gap:13px;max-width:min(420px,92vw);
  background:var(--surface);border:1px solid var(--amber);border-radius:14px;padding:13px 18px;
  box-shadow:0 12px 40px -12px rgba(22,34,63,.45);transition:transform .35s cubic-bezier(.2,.9,.3,1.2),opacity .3s;opacity:0}
.toast.on{transform:translate(-50%,0);opacity:1}
.toast .te{font-size:28px;line-height:1;flex:0 0 auto}
.toast b{font-family:var(--serif);font-size:15.5px;font-weight:600}
.toast span:last-child{font-size:13px;color:var(--ink-2);line-height:1.45}
@media (prefers-reduced-motion: reduce){.toast{transition:opacity .2s}}
.verdict .vh .ve{font-size:20px;line-height:1}
.gain{animation:pop .45s cubic-bezier(.2,.9,.3,1.4)}
@keyframes pop{0%{transform:scale(.4);opacity:0}60%{transform:scale(1.18)}100%{transform:scale(1);opacity:1}}
.bemo{font-size:52px;line-height:1.1;margin-bottom:2px;animation:pop .5s cubic-bezier(.2,.9,.3,1.4)}
.qcard{animation:entree .28s ease}
@keyframes entree{from{opacity:.3;transform:translateY(7px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion: reduce){.gain,.bemo,.qcard{animation:none}}
@media (max-width:560px){

<script>
/* =========================================================================
   Cahier de spé maths — Première générale (programme BO 22/01/2019)
   Noyau : rendu mathématique, stockage de la progression, utilitaires.
   ========================================================================= */

/* ---------- rendu mathématique (sans dépendance externe) ----------
   Mini-syntaxe :
     x^{2}  x^2   u_{n+1}  u_n     -> exposants / indices
     frac{a}{b}                    -> fraction
     sqrt{b^{2}-4ac}               -> racine carrée
     vec{AB}                       -> vecteur (flèche)
     @e @cos @sin @ln              -> texte droit (non italique)
   Les lettres isolées deviennent automatiquement italiques.            */

function mathHtml(src){
  const keep = [];
  let s = String(src);
  s = s.replace(/@([A-Za-z]+)/g, (_m, w) => { keep.push(w); return '' + (keep.length - 1) + ''; });
  s = s.replace(/(?<![A-Za-z-])([a-zA-Z])(?![A-Za-z])/g, '<i>$1</i>');
  s = s.replace(/\^\{([^{}]*)\}/g, '<sup>$1</sup>');
  s = s.replace(/\^(-?<i>[a-zA-Z]<\/i>|-?[0-9])/g, '<sup>$1</sup>');
  s = s.replace(/_\{([^{}]*)\}/g, '<sub>$1</sub>');
  s = s.replace(/_(<i>[a-zA-Z]<\/i>|[0-9])/g, '<sub>$1</sub>');
  s = s.replace(/sqrt\{([^{}]*)\}/g, '<span class="sqrt">√<span class="rad">$1</span></span>');
  s = s.replace(/frac\{([^{}]*)\}\{([^{}]*)\}/g, '<span class="frac"><span class="n">$1</span><span class="d">$2</span></span>');
  s = s.replace(/vec\{([^{}]*)\}/g, '<span class="vec">$1<span class="arw">→</span></span>');
  s = s.replace(/(\d+)/g, (_m, i) => keep[+i]);
  return s;
}
function M(src){ return '<span class="m">' + mathHtml(src) + '</span>'; }
function Mc(src){ return '<div class="center">' + M(src) + '</div>'; }

/* ---------- utilitaires numériques ---------- */
const R = {
  int(a, b){ return a + Math.floor(Math.random() * (b - a + 1)); },
  nz(a, b){ let v = 0; while (v === 0) v = R.int(a, b); return v; },
  pick(arr){ return arr[Math.floor(Math.random() * arr.length)]; },
  sign(){ return Math.random() < 0.5 ? -1 : 1; },
  shuffle(arr){ const a = arr.slice(); for (let i = a.length - 1; i > 0; i--){ const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
};

/* nombre -> texte français (virgule décimale, pas de -0) */
function nf(x, dec){
  if (!isFinite(x)) return '—';
  let v = (dec === undefined) ? x : Math.round(x * Math.pow(10, dec)) / Math.pow(10, dec);
  if (Object.is(v, -0)) v = 0;
  let s = (dec === undefined) ? String(v) : v.toFixed(dec);
  return s.replace('.', ',');
}
/* coefficient signé pour écrire un polynôme : +3x, -x, ... */
function sgn(v, unit){
  const a = Math.abs(v);
  const body = unit ? (a === 1 ? unit : nf(a) + unit) : nf(a);
  return (v < 0 ? ' - ' : ' + ') + body;
}
/* premier terme d'un polynôme (pas de + initial) */
function lead(v, unit){
  const a = Math.abs(v);
  const body = unit ? (a === 1 ? unit : nf(a) + unit) : nf(a);
  return (v < 0 ? '-' : '') + body;
}
/* écrit ax^2+bx+c proprement (termes nuls omis) */
function trinome(a, b, c, v){
  v = v || 'x';
  let s = lead(a, v + '^{2}');
  if (b !== 0) s += sgn(b, v);
  if (c !== 0) s += sgn(c, '');
  return s;
}
function pgcd(a, b){ a = Math.abs(a); b = Math.abs(b); while (b){ [a, b] = [b, a % b]; } return a || 1; }
/* fraction réduite en mini-syntaxe */
function fracTxt(p, q){
  if (q < 0){ p = -p; q = -q; }
  const g = pgcd(p, q);
  p /= g; q /= g;
  if (q === 1) return nf(p);
  return (p < 0 ? '-' : '') + 'frac{' + Math.abs(p) + '}{' + q + '}';
}

const VIDE = () => ({ v: 3, statuts: {}, methodes: {}, courant: null, serie: 0, record: 0,

/* points par exercice réussi, selon la difficulté */
const POINTS = { app: 10, ent: 15, ds: 25, exp: 40 };

/* rangs — seuils globaux et seuils par chapitre */
const RANGS = [

function rang(xp, table){
  let i = 0;
  for (let k = 0; k < table.length; k++) if (xp >= table[k].min) i = k;
  return {
    index: i, nom: table[i].nom,
    seuil: table[i].min,
    prochain: i + 1 < table.length ? table[i + 1] : null,
    pc: i + 1 < table.length ? Math.round(100 * (xp - table[i].min) / (table[i + 1].min - table[i].min)) : 100
  };
}

function mStat(id){
  if (!S.methodes[id]) S.methodes[id] = { ok: 0, ko: 0, box: 0, due: 0, dernier: 0, xp: 0 };
  if (S.methodes[id].xp === undefined) S.methodes[id].xp = 0;
  return S.methodes[id];
}
function enregistrer(mid, juste, part){
  const st = mStat(mid);
  const avait = st.ko > 0 && st.ok === 0;      /* notion ratée et jamais réussie jusqu'ici */
  marquerJour();
  let gain = 0;
  if (juste){
    st.ok++;
    st.box = Math.min(st.box + 1, BOXES.length - 1);
    S.serie = (S.serie || 0) + 1;
    gain = Math.round((POINTS[METHODE[mid].niveau] || 10) * (part === undefined ? 1 : Math.max(0, Math.min(1, part))));
    if (S.serie >= 3) gain += 5;
    if (S.serie >= 6) gain += 10;
    st.xp += gain;
    S.xpJour = (S.xpJour || 0) + gain;
    if (S.serie > (S.record || 0)) S.record = S.serie;
  } else {
    st.ko++; st.box = 0; S.serie = 0;
  }
  st.dernier = Date.now();
  st.due = Date.now() + BOXES[st.box] * JOUR;
  sauver();
  return { gain: gain, revanche: juste && avait };
}
function xpChap(id){
  let t = 0;
  (CHAP[id].gens || []).forEach(g => { const m = S.methodes[g.id]; if (m) t += (m.xp || 0); });
  return t;
}
function xpTotal(){
  let t = 0;
  for (const mid in S.methodes) t += (S.methodes[mid].xp || 0);
  return t;
}
function aRevoir(){
  const now = Date.now();
  const out = [];
  for (const mid in S.methodes){
    const st = S.methodes[mid];
    const meta = METHODE[mid];
    if (!meta) continue;
    if (st.ko > 0 && st.due <= now) out.push({ mid, st, meta });
  }
  return out.sort((a, b) => a.st.due - b.st.due);
}
function statutChap(id){ return S.statuts[id] || 'neuf'; }
function scoreChap(id){
  const ch = CHAP[id];
  let ok = 0, tot = 0;
  (ch.gens || []).forEach(g => { const st = S.methodes[g.id]; if (st){ ok += st.ok; tot += st.ok + st.ko; } });
  return { ok, tot, pc: tot ? Math.round(100 * ok / tot) : null };
}
function scoreGlobal(){
  let ok = 0, tot = 0;
  for (const mid in S.methodes){ ok += S.methodes[mid].ok; tot += S.methodes[mid].ok + S.methodes[mid].ko; }
  return { ok, tot, pc: tot ? Math.round(100 * ok / tot) : null };
}

const CLE = 'cahier-spe-maths-1re';
let docRef = null, tSave = null, chargement = true;

function localLoad(){
  try {
    const raw = localStorage.getItem(CLE);
    if (raw) return JSON.parse(raw);
  } catch (e) {}
  return null;
}
function localSave(){
  try { localStorage.setItem(CLE, JSON.stringify(S)); } catch (e) {}
}
function sauver(){
  S.maj = Date.now();
  localSave();
  if (!docRef) return;
  clearTimeout(tSave);
  tSave = setTimeout(() => {
    docRef.set(JSON.parse(JSON.stringify(S))).catch(() => {});
  }, 700);
}
function adopter(d){
  if (!d || typeof d !== 'object') return;
  S = Object.assign(VIDE(), d);
  S.statuts = S.statuts || {};
  S.methodes = S.methodes || {};
  S.serie = S.serie || 0;
  S.record = S.record || 0;
  S.badges = S.badges || [];
  S.notes = S.notes || [];
  S.jour = S.jour || '';
  S.joursSuite = S.joursSuite || 0;
  S.recordJours = S.recordJours || 0;
  S.xpJour = S.xpJour || 0;
  if (S.son === undefined) S.son = true;
  if (!S.matiere || !MAT[S.matiere] || !MAT[S.matiere].pret) S.matiere = 'maths';
  if (!S.mesMatieres || !S.mesMatieres.length) S.mesMatieres = ['maths', 'francais', 'histgeo', 'sciences', 'anglais'];
  if (S.mesMatieres.indexOf('maths') < 0) S.mesMatieres.push('maths');
  for (const mid in S.methodes) if (S.methodes[mid].xp === undefined) S.methodes[mid].xp = 0;
}
async function initStore(){
  const loc = localLoad();
  if (loc) adopter(loc);
  try {
    const db = await (window.claude && window.claude.use ? window.claude.use('db') : null);
    if (db){
      docRef = db.doc('progression/eleve');
      const snap = await docRef.get();
      const dist = snap && snap.exists ? snap.data() : null;
      if (dist && (!loc || (dist.maj || 0) >= (loc.maj || 0))) adopter(dist);
      else if (loc) sauver();
    }
  } catch (e) { /* pas de synchro : on reste en local */ }
  chargement = false;
  if (typeof rendre === 'function') rendre();
}

   en même temps : les exercices sont illimités et la correction est juste.
   niveau : 'app' (application) | 'ent' (entraînement) | 'ds' (type DS)
   ========================================================================= */

const NIVEAUX = { app: 'Application', ent: 'Entraînement', ds: 'Type DS', exp: 'Approfondissement' };
const ORDRE_NIVEAUX = ['app', 'ent', 'ds', 'exp'];

function G(chap, id, label, niveau, fn){
  const g = { id, label, niveau, chap, fn };
  CHAP[chap].gens.push(g);
  METHODE[id] = g;
}
/* écrit (x - r) en gérant le signe */
function fact(r, v){ v = v || 'x'; return r === 0 ? '(' + v + ')' : '(' + v + (r < 0 ? ' + ' + (-r) : ' - ' + r) + ')'; }
function coef(a){ return a === 1 ? '' : (a === -1 ? '-' : nf(a)); }

/* =================== SECOND DEGRÉ =================== */

G('second-degre', 'sd-canonique', 'Forme canonique', 'app', function(){
  const a = R.pick([1, -1, 2, -2, 3]);
  const al = R.nz(-4, 4), be = R.int(-8, 8);
  const b = -2 * a * al, c = be + a * al * al;
  return {
    enonce: '<p>Soit ' + M('f(x) = ' + trinome(a, b, c)) + '.</p>' +
            '<p>Écris ' + M('f') + ' sous forme canonique ' + M('f(x) = a(x - α)^{2} + β') + '.</p>',
    champs: [
      { type: 'num', label: 'α =', bon: al, tol: 1e-6 },
      { type: 'num', label: 'β =', bon: be, tol: 1e-6 }
    ],
    etapes: [
      'On identifie ' + M('a = ' + nf(a)) + ', ' + M('b = ' + nf(b)) + ', ' + M('c = ' + nf(c)) + '.',
      M('α = frac{-b}{2a} = frac{' + nf(-b) + '}{' + nf(2 * a) + '} = ' + nf(al)),
      M('β = f(α) = ' + nf(a) + ' × (' + nf(al) + ')^{2} ' + sgn(b, '') + ' × (' + nf(al) + ') ' + sgn(c, '') + ' = ' + nf(be)),
      'Conclusion : ' + M('f(x) = ' + coef(a) + fact(al) + '^{2} ' + (be === 0 ? '' : sgn(be, ''))) +
        '. Le sommet de la parabole est ' + M('S(' + nf(al) + ' ; ' + nf(be) + ')') + '.'
    ]
  };
});

G('second-degre', 'sd-discriminant', 'Discriminant et nombre de solutions', 'app', function(){
  const a = R.nz(-3, 3), b = R.int(-7, 7), c = R.int(-6, 6);
  const D = b * b - 4 * a * c;
  const nb = D > 0 ? 2 : (D === 0 ? 1 : 0);
  return {
    enonce: '<p>On considère l’équation ' + M(trinome(a, b, c) + ' = 0') + '.</p>' +
            '<p>Calcule le discriminant, puis donne le nombre de solutions réelles.</p>',
    champs: [
      { type: 'num', label: 'Δ =', bon: D, tol: 1e-6 },
      { type: 'choix', label: 'Nombre de solutions', options: ['0', '1', '2'], bon: nb }
    ],
    etapes: [
      'On identifie ' + M('a = ' + nf(a)) + ', ' + M('b = ' + nf(b)) + ', ' + M('c = ' + nf(c)) + '.',
      M('Δ = b^{2} - 4ac = (' + nf(b) + ')^{2} - 4 × (' + nf(a) + ') × (' + nf(c) + ') = ' + nf(b * b) + sgn(-4 * a * c, '') + ' = ' + nf(D)),
      D > 0 ? M('Δ > 0') + ' donc l’équation admet <b>deux solutions</b> distinctes.'
            : (D === 0 ? M('Δ = 0') + ' donc l’équation admet <b>une solution double</b>.'
                       : M('Δ &lt; 0') + ' donc l’équation n’admet <b>aucune solution réelle</b>.')
    ]
  };
});

G('second-degre', 'sd-racines', 'Résoudre une équation du second degré', 'ent', function(){
  let x1 = R.int(-6, 6), x2 = R.int(-6, 6);
  while (x2 === x1) x2 = R.int(-6, 6);
  if (x1 > x2){ const t = x1; x1 = x2; x2 = t; }
  const a = R.pick([1, 1, -1, 2]);
  const b = -a * (x1 + x2), c = a * x1 * x2;
  const D = b * b - 4 * a * c, rD = Math.sqrt(D);
  return {
    enonce: '<p>Résous dans ' + M('ℝ') + ' l’équation</p>' + Mc(trinome(a, b, c) + ' = 0'),
    champs: [
      { type: 'num', label: 'plus petite solution', bon: x1, tol: 1e-6 },
      { type: 'num', label: 'plus grande solution', bon: x2, tol: 1e-6 }
    ],
    etapes: [
      M('a = ' + nf(a)) + ', ' + M('b = ' + nf(b)) + ', ' + M('c = ' + nf(c)) + '.',
      M('Δ = b^{2} - 4ac = ' + nf(b * b) + sgn(-4 * a * c, '') + ' = ' + nf(D)) + ' — ' + M('Δ > 0') + ', il y a deux solutions.',
      M('sqrt{Δ} = ' + nf(rD)),
      M('x_1 = frac{' + nf(-b) + ' - ' + nf(rD) + '}{' + nf(2 * a) + '} = ' + nf(a > 0 ? x1 : x2)) + '   et   ' +
        M('x_2 = frac{' + nf(-b) + ' + ' + nf(rD) + '}{' + nf(2 * a) + '} = ' + nf(a > 0 ? x2 : x1)),
      'Les solutions sont ' + M(nf(x1)) + ' et ' + M(nf(x2)) + '. Vérification : ' +
        M('x_1 + x_2 = frac{-b}{a} = ' + nf(-b / a)) + ' et ' + M('x_1 x_2 = frac{c}{a} = ' + nf(c / a)) + '.'
    ]
  };
});

G('second-degre', 'sd-factorisation', 'Factoriser un trinôme', 'ent', function(){
  let x1 = R.nz(-5, 5), x2 = R.nz(-5, 5);
  while (x2 === x1 || x2 === -x1) x2 = R.nz(-5, 5);
  if (x1 > x2){ const t = x1; x1 = x2; x2 = t; }
  const a = R.pick([2, -2, 3, -3]);
  const b = -a * (x1 + x2), c = a * x1 * x2;
  const bon = M(nf(a) + fact(x1) + fact(x2));
  return {
    enonce: '<p>Factorise le trinôme</p>' + Mc('f(x) = ' + trinome(a, b, c)),
    qcm: {
      options: [bon,
        M(fact(x1) + fact(x2)),
        M(nf(a) + fact(-x1) + fact(-x2)),
        M(nf(a) + fact(x1) + fact(-x2))],
      bon: 0
    },
    etapes: [
      M('Δ = ' + nf(b) + '^{2} - 4 × ' + nf(a) + ' × ' + nf(c) + ' = ' + nf(b * b - 4 * a * c)) + ' — deux racines.',
      'Les racines sont ' + M('x_1 = ' + nf(x1)) + ' et ' + M('x_2 = ' + nf(x2)) + '.',
      'La forme factorisée est ' + M('f(x) = a(x - x_1)(x - x_2)') + ', donc ' + bon + '.',
      '<b>Ne jamais oublier le coefficient ' + M('a') + '</b> : sans lui, on ne retrouve pas le même trinôme en développant.'
    ]
  };
});

G('second-degre', 'sd-signe', 'Signe d’un trinôme', 'ent', function(){
  const negatif = Math.random() < 0.5;          // on demande f(x) < 0 ou f(x) > 0
  const sansRacine = Math.random() < 0.28;
  const a = R.pick([1, 2, -1, -2]);
  let b, c, x1, x2, D;
  if (sansRacine){
    do { b = R.int(-4, 4); c = R.int(-6, 6); D = b * b - 4 * a * c; } while (D >= 0);
  } else {
    x1 = R.int(-5, 4); x2 = x1 + R.int(1, 5);
    b = -a * (x1 + x2); c = a * x1 * x2; D = b * b - 4 * a * c;
  }
  const optEntre = sansRacine ? null : M('] ' + nf(x1) + ' ; ' + nf(x2) + ' [');
  const optDehors = sansRacine ? null : M('] -∞ ; ' + nf(x1) + ' [ ∪ ] ' + nf(x2) + ' ; +∞ [');
  const optTout = 'Pour tout réel ' + M('x');
  const optAucun = 'Aucune valeur de ' + M('x');
  let options, bon;
  if (sansRacine){
    options = [optTout, optAucun, M('] -∞ ; 0 [') , M('] 0 ; +∞ [')];
    // Δ<0 : f garde le signe de a
    const signePositif = a > 0;
    bon = (negatif ? (signePositif ? 1 : 0) : (signePositif ? 0 : 1));
  } else {
    options = [optEntre, optDehors, optTout, optAucun];
    // a>0 : négatif entre les racines ; a<0 : positif entre les racines
    bon = negatif ? (a > 0 ? 0 : 1) : (a > 0 ? 1 : 0);
  }
  return {
    enonce: '<p>Soit ' + M('f(x) = ' + trinome(a, b, c)) + '.</p>' +
            '<p>Pour quelles valeurs de ' + M('x') + ' a-t-on ' + M('f(x) ' + (negatif ? '&lt;' : '>') + ' 0') + ' ?</p>',
    qcm: { options: options, bon: bon },
    etapes: sansRacine ? [
      M('Δ = ' + nf(b) + '^{2} - 4 × ' + nf(a) + ' × ' + nf(c) + ' = ' + nf(D)) + ' : ' + M('Δ &lt; 0') + ', il n’y a <b>pas de racine</b>.',
      'Le trinôme garde donc <b>toujours le signe de ' + M('a') + '</b>, ici ' + M('a = ' + nf(a)) + ' donc ' + M('f(x) ' + (a > 0 ? '> 0' : '&lt; 0')) + ' pour tout réel.',
      'Réponse : ' + (bon === 0 ? optTout : optAucun) + '.'
    ] : [
      M('Δ = ' + nf(D) + ' > 0') + ' : deux racines ' + M('x_1 = ' + nf(x1)) + ' et ' + M('x_2 = ' + nf(x2)) + '.',
      'Règle : ' + M('f(x)') + ' est du <b>signe de ' + M('a') + '</b> à l’extérieur des racines, et du <b>signe contraire</b> entre les racines.',
      'Ici ' + M('a = ' + nf(a)) + ' : ' + M('f(x)') + ' est ' + (a > 0 ? 'positif' : 'négatif') + ' à l’extérieur et ' +
        (a > 0 ? 'négatif' : 'positif') + ' sur ' + optEntre + '.',
      'Réponse : ' + options[bon] + '.'
    ]
  };
});

G('second-degre', 'sd-optim', 'Problème d’optimisation', 'ds', function(){
  if (Math.random() < 0.5){
    const L = R.pick([40, 60, 80, 100, 120]);
    const x = L / 4, A = L * L / 8;
    return {
      enonce: '<p>Un éleveur dispose de <b>' + L + ' m</b> de grillage pour clôturer un enclos <b>rectangulaire adossé à un mur</b> ' +
              '(seuls trois côtés sont à clôturer : deux largeurs ' + M('x') + ' et une longueur).</p>' +
              '<p>Quelle largeur ' + M('x') + ' rend l’aire maximale, et combien vaut cette aire ?</p>',
      champs: [
        { type: 'num', label: 'x (en m)', bon: x, tol: 1e-6 },
        { type: 'num', label: 'aire max (en m²)', bon: A, tol: 1e-6 }
      ],
      etapes: [
        'La longueur vaut ' + M(L + ' - 2x') + ', donc l’aire est ' + M('A(x) = x(' + L + ' - 2x) = -2x^{2} + ' + L + 'x') + ', avec ' + M('x ∈ ] 0 ; ' + (L / 2) + ' [') + '.',
        'C’est un trinôme avec ' + M('a = -2 &lt; 0') + ' : la parabole est tournée vers le bas, le <b>sommet est un maximum</b>.',
        M('α = frac{-b}{2a} = frac{-' + L + '}{-4} = ' + nf(x)),
        M('A(' + nf(x) + ') = ' + nf(x) + ' × (' + L + ' - ' + nf(2 * x) + ') = ' + nf(x) + ' × ' + nf(L - 2 * x) + ' = ' + nf(A)),
        'L’aire est maximale pour ' + M('x = ' + nf(x)) + ' m et vaut ' + M(nf(A)) + ' m².'
      ]
    };
  }
  const v = R.pick([20, 30, 40, 50]);
  const h0 = R.pick([0, 1, 2, 5]);
  const t = v / 10, h = v * v / 20 + h0;
  return {
    enonce: '<p>Un objet est lancé vers le haut. Sa hauteur, en mètres, après ' + M('t') + ' secondes est</p>' +
            Mc('h(t) = -5t^{2} + ' + v + 't' + (h0 ? ' + ' + h0 : '')) +
            '<p>À quel instant la hauteur est-elle maximale, et quelle est cette hauteur ?</p>',
    champs: [
      { type: 'num', label: 't (en s)', bon: t, tol: 1e-6 },
      { type: 'num', label: 'hauteur max (en m)', bon: h, tol: 1e-6 }
    ],
    etapes: [
      'Trinôme avec ' + M('a = -5 &lt; 0') + ' : le sommet est un <b>maximum</b>.',
      M('α = frac{-b}{2a} = frac{-' + v + '}{-10} = ' + nf(t)) + ' seconde(s).',
      M('h(' + nf(t) + ') = -5 × ' + nf(t * t) + ' + ' + v + ' × ' + nf(t) + (h0 ? ' + ' + h0 : '') + ' = ' + nf(h)) + ' mètres.',
      'La hauteur maximale est ' + M(nf(h)) + ' m, atteinte au bout de ' + M(nf(t)) + ' s.'
    ]
  };
});

G('suites', 'su-nature', 'Reconnaître la nature d’une suite', 'app', function(){
  const arith = Math.random() < 0.5;
  const explicite = Math.random() < 0.5;
  let enonce, raison, etapes;
  if (arith){
    const u0 = R.int(-10, 20), r = R.nz(-7, 9);
    raison = r;
    if (explicite){
      enonce = M('u_n = ' + lead(r, 'n') + (u0 ? sgn(u0, '') : ''));
      etapes = [
        'On calcule ' + M('u_{n+1} - u_n') + ' : ' + M('u_{n+1} = ' + nf(r) + '(n + 1) ' + (u0 ? sgn(u0, '') : '') + ' = ' + lead(r, 'n') + sgn(r + u0, '')) + '.',
        M('u_{n+1} - u_n = ' + nf(r)) + ' : c’est une <b>constante</b>.',
        'La suite est donc <b>arithmétique</b> de raison ' + M('r = ' + nf(r)) + '.'
      ];
    } else {
      enonce = M('u_0 = ' + nf(u0)) + ' et ' + M('u_{n+1} = u_n ' + sgn(r, ''));
      etapes = [
        'On passe d’un terme au suivant en <b>ajoutant</b> toujours ' + M(nf(r)) + '.',
        'La suite est <b>arithmétique</b> de raison ' + M('r = ' + nf(r)) + '.',
        'Son terme général est ' + M('u_n = u_0 + nr = ' + nf(u0) + sgn(r, 'n'))
      ];
    }
  } else {
    const u0 = R.pick([1, 2, 3, 5, 8, 10, 100]), q = R.pick([2, 3, 5, 0.5, 1.5, -2, 0.8]);
    raison = q;
    if (explicite){
      enonce = M('u_n = ' + (u0 === 1 ? '' : nf(u0) + ' × ') + '(' + nf(q) + ')^{n}');
      etapes = [
        'On calcule ' + M('frac{u_{n+1}}{u_n}') + '.',
        M('frac{u_{n+1}}{u_n} = frac{' + nf(u0) + ' × (' + nf(q) + ')^{n+1}}{' + nf(u0) + ' × (' + nf(q) + ')^{n}} = ' + nf(q)) + ' : constante.',
        'La suite est <b>géométrique</b> de raison ' + M('q = ' + nf(q)) + '.'
      ];
    } else {
      enonce = M('u_0 = ' + nf(u0)) + ' et ' + M('u_{n+1} = ' + nf(q) + ' × u_n');
      etapes = [
        'On passe d’un terme au suivant en <b>multipliant</b> toujours par ' + M(nf(q)) + '.',
        'La suite est <b>géométrique</b> de raison ' + M('q = ' + nf(q)) + '.',
        'Son terme général est ' + M('u_n = u_0 q^{n} = ' + nf(u0) + ' × (' + nf(q) + ')^{n}')
      ];
    }
  }
  return {
    enonce: '<p>On considère la suite définie par</p>' + '<div class="center">' + enonce + '</div>' +
            '<p>Quelle est sa nature, et quelle est sa raison ?</p>',
    champs: [
      { type: 'choix', label: 'Nature', options: ['Arithmétique', 'Géométrique', 'Ni l’une ni l’autre'], bon: arith ? 0 : 1 },
      { type: 'num', label: 'Raison', bon: raison, tol: 1e-6 }
    ],
    etapes: etapes
  };
});

G('suites', 'su-terme', 'Calculer des termes', 'app', function(){
  const u0 = R.int(-4, 9), a = R.pick([2, 3, -2]), b = R.int(-6, 6);
  const u1 = a * u0 + b, u2 = a * u1 + b, u3 = a * u2 + b;
  return {
    enonce: '<p>Soit la suite définie par ' + M('u_0 = ' + nf(u0)) + ' et ' + M('u_{n+1} = ' + lead(a, 'u_n') + (b ? sgn(b, '') : '')) + '.</p>' +
            '<p>Calcule ' + M('u_3') + '.</p>',
    champs: [{ type: 'num', label: 'u₃ =', bon: u3, tol: 1e-6 }],
    etapes: [
      M('u_1 = ' + nf(a) + ' × ' + nf(u0) + (b ? sgn(b, '') : '') + ' = ' + nf(u1)),
      M('u_2 = ' + nf(a) + ' × ' + nf(u1) + (b ? sgn(b, '') : '') + ' = ' + nf(u2)),
      M('u_3 = ' + nf(a) + ' × ' + nf(u2) + (b ? sgn(b, '') : '') + ' = ' + nf(u3)),
      'Attention : la suite est définie <b>par récurrence</b>, il faut calculer tous les termes intermédiaires.'
    ]
  };
});

      'Formule du cours : ' + M('u_n = u_0 × q^{n}') + '.',
      'Vérification : ' + M('u_0 = ' + nf(u0) + ' × ' + nf(q) + '^{0} = ' + nf(u0)) + ' ✓'
    ]

G('suites', 'su-somme', 'Somme de termes', 'ent', function(){
  const v = R.int(1, 3);
  if (v === 1){
    const n = R.int(18, 60), S = n * (n + 1) / 2;
    return {
      enonce: '<p>Calcule la somme des entiers de 1 à ' + n + ' :</p>' + Mc('S = 1 + 2 + 3 + … + ' + n),
      champs: [{ type: 'num', label: 'S =', bon: S, tol: 1e-6 }],
      etapes: [
        'Formule du cours : ' + M('1 + 2 + … + n = frac{n(n+1)}{2}') + '.',
        M('S = frac{' + n + ' × ' + (n + 1) + '}{2} = frac{' + (n * (n + 1)) + '}{2} = ' + nf(S))
      ]
    };
  }
  if (v === 2){
    const u0 = R.int(-5, 12), r = R.nz(-5, 7), n = R.int(8, 25);
    const un = u0 + n * r, S = (n + 1) * (u0 + un) / 2;
    return {
      enonce: '<p>' + M('(u_n)') + ' est arithmétique de premier terme ' + M('u_0 = ' + nf(u0)) + ' et de raison ' + M('r = ' + nf(r)) + '.</p>' +
              '<p>Calcule ' + M('S = u_0 + u_1 + … + u_{' + n + '}') + '.</p>',
      champs: [{ type: 'num', label: 'S =', bon: S, tol: 1e-6 }],
      etapes: [
        M('u_{' + n + '} = u_0 + ' + n + 'r = ' + nf(u0) + ' + ' + n + ' × (' + nf(r) + ') = ' + nf(un)),
        'Il y a ' + M(nf(n + 1)) + ' termes (de ' + M('u_0') + ' à ' + M('u_{' + n + '}') + ').',
        'Formule : ' + M('S = frac{(nombre de termes) × (premier + dernier)}{2}'),
        M('S = frac{' + (n + 1) + ' × (' + nf(u0) + ' + ' + nf(un) + ')}{2} = ' + nf(S))
      ]
    };
  }
  const n = R.int(5, 12), S = Math.pow(2, n + 1) - 1;
  return {
    enonce: '<p>Calcule</p>' + Mc('S = 1 + 2 + 2^{2} + 2^{3} + … + 2^{' + n + '}'),
    champs: [{ type: 'num', label: 'S =', bon: S, tol: 1e-6 }],
    etapes: [
      'Formule du cours : ' + M('1 + q + … + q^{n} = frac{1 - q^{n+1}}{1 - q}') + ' avec ' + M('q = 2') + '.',
      M('S = frac{1 - 2^{' + (n + 1) + '}}{1 - 2} = frac{1 - ' + nf(Math.pow(2, n + 1)) + '}{-1} = ' + nf(S)),
      'Astuce de vérification : cette somme vaut toujours ' + M('2^{n+1} - 1') + '.'
    ]
  };
});

G('suites', 'su-variation', 'Sens de variation', 'ent', function(){
  const cas = R.int(1, 4);
  let enonce, bon, expl;
  if (cas === 1){
    const u0 = R.int(-5, 10), r = R.nz(-6, 6);
    enonce = M('u_0 = ' + nf(u0)) + ' et ' + M('u_{n+1} = u_n ' + sgn(r, ''));
    bon = r > 0 ? 0 : 1;
    expl = 'Suite <b>arithmétique</b> de raison ' + M('r = ' + nf(r)) + '. Comme ' + M('r ' + (r > 0 ? '> 0' : '&lt; 0')) +
           ', la suite est <b>' + (r > 0 ? 'croissante' : 'décroissante') + '</b>.';
  } else if (cas === 2){
    const u0 = R.pick([2, 5, 10, 100]), q = R.pick([1.5, 2, 3]);
    enonce = M('u_0 = ' + nf(u0)) + ' et ' + M('u_{n+1} = ' + nf(q) + ' × u_n');
    bon = 0;
    expl = 'Suite <b>géométrique</b> de raison ' + M('q = ' + nf(q) + ' > 1') + ' avec ' + M('u_0 > 0') + ' : elle est <b>croissante</b>.';
  } else if (cas === 3){
    const u0 = R.pick([80, 100, 200, 1000]), q = R.pick([0.5, 0.8, 0.9]);
    enonce = M('u_0 = ' + nf(u0)) + ' et ' + M('u_{n+1} = ' + nf(q) + ' × u_n');
    bon = 1;
    expl = 'Suite <b>géométrique</b> de raison ' + M('0 &lt; q = ' + nf(q) + ' &lt; 1') + ' avec ' + M('u_0 > 0') + ' : elle est <b>décroissante</b>.';
  } else {
    const u0 = R.pick([1, 2, 3]), q = R.pick([-2, -3, -0.5]);
    enonce = M('u_0 = ' + nf(u0)) + ' et ' + M('u_{n+1} = ' + nf(q) + ' × u_n');
    bon = 2;
    expl = 'La raison est <b>négative</b> (' + M('q = ' + nf(q)) + ') : les termes changent de signe alternativement, la suite n’est <b>pas monotone</b>.';
  }
  return {
    enonce: '<p>Étudie le sens de variation de la suite définie par</p><div class="center">' + enonce + '</div>',
    qcm: { options: ['Croissante', 'Décroissante', 'Ni croissante ni décroissante', 'Constante'], bon: bon },
    etapes: [expl, 'Rappel : pour une suite géométrique, le sens de variation dépend <b>à la fois</b> du signe de ' + M('u_0') + ' et de la valeur de ' + M('q') + '.']
  };
});

G('suites', 'su-seuil', 'Recherche de seuil', 'ds', function(){
  const croissante = Math.random() < 0.7;
  const u0 = R.pick([200, 500, 1000, 1500, 2500]);
  const p = croissante ? R.pick([2, 3, 4, 5, 8, 10]) : R.pick([10, 15, 20]);
  const q = croissante ? 1 + p / 100 : 1 - p / 100;
  const k = R.int(6, 20);
  let S = u0 * Math.pow(q, k);
  S = croissante ? Math.round(S / 100) * 100 : Math.round(S / 10) * 10;
  if (croissante && S <= u0) S = u0 + 100;
  if (!croissante && S < 10) S = 10;
  let u = u0, n = 0, trace = [];
  while (croissante ? u <= S : u >= S){ u = u * q; n++; if (n <= 3) trace.push(n); if (n > 4000) break; }
  const suiteTxt = croissante ? 'augmente de ' + p + ' % par an' : 'diminue de ' + p + ' % par an';
  return {
    enonce: '<p>Une population de <b>' + nf(u0) + '</b> individus ' + suiteTxt + '. On note ' + M('u_n') +
            ' l’effectif au bout de ' + M('n') + ' années.</p>' +
            '<p>À partir de quelle année l’effectif ' + (croissante ? 'dépasse-t-il' : 'passe-t-il en dessous de') +
            ' <b>' + nf(S) + '</b> ? (donne le plus petit entier ' + M('n') + ')</p>',
    champs: [{ type: 'num', label: 'n =', bon: n, tol: 1e-9 }],
    etapes: [
      (croissante ? 'Une hausse' : 'Une baisse') + ' de ' + p + ' % correspond à un coefficient multiplicateur ' + M('q = ' + nf(q)) +
        ' : la suite est <b>géométrique</b>, ' + M('u_n = ' + nf(u0) + ' × ' + nf(q) + '^{n}') + '.',
      'On calcule les termes jusqu’à ' + (croissante ? 'dépasser' : 'descendre sous') + ' ' + M(nf(S)) + ' : ' +
        trace.map(i => M('u_{' + i + '} ≈ ' + nf(u0 * Math.pow(q, i), 1))).join(', ') + ', …',
      'On obtient ' + M('u_{' + n + '} ≈ ' + nf(u0 * Math.pow(q, n), 1)) + ' et ' + M('u_{' + (n - 1) + '} ≈ ' + nf(u0 * Math.pow(q, n - 1), 1)) +
        ' : le seuil est franchi pour ' + M('n = ' + n) + '.',
      'Algorithme correspondant :<pre class="code">def seuil():\n    u = ' + u0 + '\n    n = 0\n    while u ' + (croissante ? '&lt;=' : '&gt;=') + ' ' + S +
        ':\n        u = u * ' + String(q) + '\n        n = n + 1\n    return n</pre>'
    ]
  };
});

G('derivation', 'de-polynome', 'Dériver un polynôme', 'app', function(){
  const a = R.nz(-4, 4), b = R.nz(-6, 6), c = R.nz(-8, 8), d = R.int(-9, 9);
  const f = lead(a, 'x^{3}') + sgn(b, 'x^{2}') + sgn(c, 'x') + (d ? sgn(d, '') : '');
  return {
    enonce: '<p>Calcule la dérivée de</p>' + Mc('f(x) = ' + f),
    qcm: {
      options: [
        M('f′(x) = ' + lead(3 * a, 'x^{2}') + sgn(2 * b, 'x') + sgn(c, '')),
        M('f′(x) = ' + lead(3 * a, 'x^{2}') + sgn(2 * b, 'x') + sgn(c, '') + (d ? sgn(d, '') : ' + 1')),
        M('f′(x) = ' + lead(a, 'x^{2}') + sgn(b, 'x') + sgn(c, '')),
        M('f′(x) = ' + lead(3 * a, 'x^{2}') + sgn(b, 'x') + sgn(c, ''))
      ], bon: 0
    },
    etapes: [
      'On dérive terme par terme avec ' + M('(x^{n})′ = n x^{n-1}') + '.',
      M('(' + lead(a, 'x^{3}') + ')′ = ' + lead(3 * a, 'x^{2}')) + ', ' +
        M('(' + lead(b, 'x^{2}') + ')′ = ' + lead(2 * b, 'x')) + ', ' +
        M('(' + lead(c, 'x') + ')′ = ' + nf(c)) + ', et la dérivée de la constante ' + M(nf(d)) + ' est <b>0</b>.',
      M('f′(x) = ' + lead(3 * a, 'x^{2}') + sgn(2 * b, 'x') + sgn(c, ''))
    ]
  };
});

G('derivation', 'de-nombre-derive', 'Nombre dérivé', 'app', function(){
  const a = R.nz(-4, 4), b = R.nz(-7, 7), c = R.int(-8, 8), k = R.nz(-4, 4);
  const v = 2 * a * k + b;
  return {
    enonce: '<p>Soit ' + M('f(x) = ' + trinome(a, b, c)) + '.</p><p>Calcule ' + M('f′(' + nf(k) + ')') + '.</p>',
    champs: [{ type: 'num', label: 'f′(' + nf(k) + ') =', bon: v, tol: 1e-6 }],
    etapes: [
      M('f′(x) = ' + lead(2 * a, 'x') + sgn(b, '')),
      M('f′(' + nf(k) + ') = ' + nf(2 * a) + ' × (' + nf(k) + ') ' + sgn(b, '') + ' = ' + nf(v)),
      'Interprétation : ' + M(nf(v)) + ' est le <b>coefficient directeur de la tangente</b> à la courbe au point d’abscisse ' + M(nf(k)) + '.'

});

G('derivation', 'de-tangente', 'Équation de la tangente', 'ent', function(){
  const a = R.pick([1, -1, 2, -2]), b = R.nz(-6, 6), c = R.int(-8, 8), k = R.nz(-3, 3);
  const m = 2 * a * k + b, y0 = a * k * k + b * k + c, p = y0 - m * k;
  return {
    enonce: '<p>Soit ' + M('f(x) = ' + trinome(a, b, c)) + '.</p>' +
            '<p>Détermine l’équation ' + M('y = mx + p') + ' de la tangente à la courbe au point d’abscisse ' + M('a = ' + nf(k)) + '.</p>',
    champs: [
      { type: 'num', label: 'm =', bon: m, tol: 1e-6 },
      { type: 'num', label: 'p =', bon: p, tol: 1e-6 }
    ],
    etapes: [
      M('f(' + nf(k) + ') = ' + nf(y0)) + ' et ' + M('f′(x) = ' + lead(2 * a, 'x') + sgn(b, '')) + ' donc ' + M('f′(' + nf(k) + ') = ' + nf(m)) + '.',
      'Formule : ' + M('y = f′(a)(x - a) + f(a)') + ', ici ' + M('y = ' + nf(m) + '(x ' + (k < 0 ? '+ ' + (-k) : '- ' + k) + ')' + sgn(y0, '')) + '.',
      'On développe : ' + M('y = ' + lead(m, 'x') + ' ' + sgn(-m * k, '') + ' ' + sgn(y0, '')) + ' soit ' + M('y = ' + lead(m, 'x') + sgn(p, '')) + '.',
      'Donc ' + M('m = ' + nf(m)) + ' et ' + M('p = ' + nf(p)) + '.'
    ]
  };
});

G('derivation', 'de-usuelles', 'Dériver racine et inverse', 'ent', function(){
  const a = R.nz(-5, 5), b = R.nz(-6, 6), c = R.int(-5, 5);
  /* f(x) = a√x + b/x + cx   →   f'(x) = a/(2√x) - b/x² + c */
  const fr = (p, q) => (p < 0 ? ' - ' : ' + ') + 'frac{' + Math.abs(p) + '}{' + q + '}';
  const f = lead(a, 'sqrt{x}') + fr(b, 'x') + (c ? sgn(c, 'x') : '');
  const bonne = 'f′(x) = frac{' + nf(a) + '}{2sqrt{x}}' + fr(-b, 'x^{2}') + (c ? sgn(c, '') : '');
  return {
    enonce: '<p>Calcule la dérivée, sur ' + M('] 0 ; +∞ [') + ', de</p>' + Mc('f(x) = ' + f),
    qcm: {
      options: [
        M(bonne),
        M('f′(x) = frac{' + nf(a) + '}{2sqrt{x}}' + fr(b, 'x^{2}') + (c ? sgn(c, '') : '')),
        M('f′(x) = frac{' + nf(a) + '}{sqrt{x}}' + fr(-b, 'x^{2}') + (c ? sgn(c, '') : '')),
        M('f′(x) = ' + lead(2 * a, 'sqrt{x}') + fr(-b, 'x') + (c ? sgn(c, '') : ''))
      ], bon: 0
    },
    etapes: [
      'Dérivées du cours : ' + M('(sqrt{x})′ = frac{1}{2sqrt{x}}') + ' et ' + M('(frac{1}{x})′ = frac{-1}{x^{2}}') + '.',
      'Terme par terme : ' + M('(' + lead(a, 'sqrt{x}') + ')′ = frac{' + nf(a) + '}{2sqrt{x}}') + ', ' +
        M('(frac{' + nf(b) + '}{x})′ = frac{' + nf(-b) + '}{x^{2}}') + (c ? ', et ' + M('(' + lead(c, 'x') + ')′ = ' + nf(c)) : '') + '.',
      M(bonne),
      '<b>Attention au signe</b> : dériver ' + M('frac{1}{x}') + ' fait apparaître un signe moins.'
    ]
  };
});

G('derivation', 'de-produit-quotient', 'Produit et quotient', 'ent', function(){
  if (Math.random() < 0.5){
    const a = R.nz(-4, 4), b = R.nz(-6, 6), c = R.nz(-4, 4), d = R.nz(-6, 6);
    return {
      enonce: '<p>Calcule la dérivée de</p>' + Mc('f(x) = (' + lead(a, 'x') + sgn(b, '') + ')(' + lead(c, 'x') + sgn(d, '') + ')'),
      qcm: {
        options: [
          M('f′(x) = ' + lead(2 * a * c, 'x') + sgn(a * d + b * c, '')),
          M('f′(x) = ' + nf(a * c)),
          M('f′(x) = ' + lead(a * c, 'x') + sgn(a * d + b * c, '')),
          M('f′(x) = ' + lead(2 * a * c, 'x') + sgn(a * d - b * c, ''))
        ], bon: 0
      },
      etapes: [
        'On pose ' + M('u(x) = ' + lead(a, 'x') + sgn(b, '')) + ' et ' + M('v(x) = ' + lead(c, 'x') + sgn(d, '')) + ', donc ' +
          M('u′(x) = ' + nf(a)) + ' et ' + M('v′(x) = ' + nf(c)) + '.',
        'Formule : ' + M('(uv)′ = u′v + uv′') + '.',
        M('f′(x) = ' + nf(a) + '(' + lead(c, 'x') + sgn(d, '') + ') + (' + lead(a, 'x') + sgn(b, '') + ') × ' + nf(c)),
        'On développe : ' + M('f′(x) = ' + lead(2 * a * c, 'x') + sgn(a * d + b * c, '')) + '.'
      ]
    };
  }
  let a, b, c, d, num;
  do {
    a = R.nz(-4, 4); b = R.nz(-6, 6); c = R.pick([1, 2, -1, -2]); d = R.nz(-5, 5);
    num = a * d - b * c;
  } while (num === 0);
  return {
    enonce: '<p>Calcule la dérivée de</p>' + Mc('f(x) = frac{' + lead(a, 'x') + sgn(b, '') + '}{' + lead(c, 'x') + sgn(d, '') + '}'),
    qcm: {
      options: [
        M('f′(x) = frac{' + nf(num) + '}{(' + lead(c, 'x') + sgn(d, '') + ')^{2}}'),
        M('f′(x) = frac{' + nf(b * c - a * d) + '}{(' + lead(c, 'x') + sgn(d, '') + ')^{2}}'),
        M('f′(x) = frac{' + nf(a) + '}{' + nf(c) + '}'),
        M('f′(x) = frac{' + nf(num) + '}{' + lead(c, 'x') + sgn(d, '') + '}')
      ], bon: 0
    },
    etapes: [
      M('u(x) = ' + lead(a, 'x') + sgn(b, '')) + ', ' + M('u′(x) = ' + nf(a)) + ' ; ' +
        M('v(x) = ' + lead(c, 'x') + sgn(d, '')) + ', ' + M('v′(x) = ' + nf(c)) + '.',
      'Formule : ' + M('(frac{u}{v})′ = frac{u′v - uv′}{v^{2}}') + ' — <b>l’ordre compte</b>.',
      M('u′v - uv′ = ' + nf(a) + '(' + lead(c, 'x') + sgn(d, '') + ') - (' + lead(a, 'x') + sgn(b, '') + ') × (' + nf(c) + ') = ' + nf(num)),
      'Les termes en ' + M('x') + ' se simplifient : ' + M('f′(x) = frac{' + nf(num) + '}{(' + lead(c, 'x') + sgn(d, '') + ')^{2}}') + '.'
    ]
  };
});

G('derivation', 'de-variations', 'Extremums d’un polynôme de degré 3', 'ds', function(){

    ]

    champs: [{ type: 'num', label: 'u⃗ · v⃗ =', bon: ps, tol: 1e-6 }],
    etapes: [
      'Formule : ' + M('vec{u} · vec{v} = ‖vec{u}‖ × ‖vec{v}‖ × @cos(θ)') + '.',

G('produit-scalaire', 'ps-alkashi', 'Théorème d’Al-Kashi', 'ent', function(){
  const ang = R.pick([60, 90, 120]);
  const cosv = { 60: 0.5, 90: 0, 120: -0.5 }[ang];
  const b = R.int(3, 12), c = R.int(3, 12);
  const a2 = b * b + c * c - 2 * b * c * cosv;
  const a = Math.sqrt(a2);
  const cosTxt = { 60: 'frac{1}{2}', 90: '0', 120: '-frac{1}{2}' }[ang];
  return {
    enonce: '<p>Dans un triangle ' + M('ABC') + ' : ' + M('AB = ' + c) + ', ' + M('AC = ' + b) +
            ' et l’angle ' + M('Â') + ' mesure <b>' + ang + '°</b>.</p>' +
            '<p>Calcule ' + M('BC^{2}') + ' puis ' + M('BC') + ' (arrondi au dixième).</p>',
    champs: [
      { type: 'num', label: 'BC² =', bon: a2, tol: 1e-6 },
      { type: 'num', label: 'BC ≈', bon: Math.round(a * 10) / 10, tol: 0.051 }
    ],
    etapes: [
      'Al-Kashi : ' + M('BC^{2} = AB^{2} + AC^{2} - 2 × AB × AC × @cos(Â)') + '.',
      M('@cos(' + ang + '°) = ' + cosTxt),
      M('BC^{2} = ' + (c * c) + ' + ' + (b * b) + ' - 2 × ' + c + ' × ' + b + ' × ' + (cosv < 0 ? '(' + nf(cosv) + ')' : nf(cosv)) + ' = ' + nf(a2)),
      M('BC = sqrt{' + nf(a2) + '} ≈ ' + nf(Math.round(a * 100) / 100)) + ', soit ' + M(nf(Math.round(a * 10) / 10)) + ' au dixième.',
      ang === 90 ? 'Avec un angle droit, Al-Kashi redonne exactement le <b>théorème de Pythagore</b>.'
        : (ang > 90 ? 'Angle <b>obtus</b> : le cosinus est négatif, le terme ' + M('-2bc @cos(Â)') + ' devient positif et <b>allonge</b> le côté opposé.'
                    : 'Angle <b>aigu</b> : le cosinus est positif, le côté opposé est plus <b>court</b> que dans le cas rectangle.')
    ]
  };
});

G('produit-scalaire', 'ps-rectangle', 'Démontrer qu’un triangle est rectangle', 'ds', function(){
  const ortho = Math.random() < 0.5;
  const ax = R.int(-4, 4), ay = R.int(-4, 4);
  const p = R.nz(-4, 4), q = R.nz(-4, 4);
  const bx = ax + p, by = ay + q;
  let cx, cy;
  if (ortho){ const t = R.pick([1, -1, 2, -2]); cx = ax - q * t; cy = ay + p * t; }
  else { let u = R.nz(-4, 4), v = R.nz(-4, 4); while (p * u + q * v === 0){ u = R.nz(-4, 4); v = R.nz(-4, 4); } cx = ax + u; cy = ay + v; }
  const abx = bx - ax, aby = by - ay, acx = cx - ax, acy = cy - ay;
  const ps = abx * acx + aby * acy;
  return {
    enonce: '<p>Dans un repère orthonormé : ' + M('A(' + nf(ax) + ' ; ' + nf(ay) + ')') + ', ' + M('B(' + nf(bx) + ' ; ' + nf(by) + ')') +
            ', ' + M('C(' + nf(cx) + ' ; ' + nf(cy) + ')') + '.</p>' +
            '<p>Calcule ' + M('vec{AB} · vec{AC}') + ', puis dis si le triangle ' + M('ABC') + ' est rectangle en ' + M('A') + '.</p>',
    champs: [
      { type: 'num', label: 'AB⃗ · AC⃗ =', bon: ps, tol: 1e-6 },
      { type: 'choix', label: 'Rectangle en A ?', options: ['Oui', 'Non'], bon: ps === 0 ? 0 : 1 }
    ],
    etapes: [
      'Coordonnées des vecteurs : ' + M('vec{AB}(x_B - x_A ; y_B - y_A) = vec{AB}(' + nf(abx) + ' ; ' + nf(aby) + ')') + ' et ' +
        M('vec{AC}(' + nf(acx) + ' ; ' + nf(acy) + ')') + '.',
      M('vec{AB} · vec{AC} = (' + nf(abx) + ') × (' + nf(acx) + ') + (' + nf(aby) + ') × (' + nf(acy) + ') = ' + nf(abx * acx) + sgn(aby * acy, '') + ' = ' + nf(ps)),
      ps === 0
        ? 'Le produit scalaire est <b>nul</b>, donc ' + M('vec{AB} ⊥ vec{AC}') + ' : le triangle <b>est rectangle en ' + M('A') + '</b>.'
        : 'Le produit scalaire <b>n’est pas nul</b> (' + M(nf(ps)) + '), donc les vecteurs ne sont pas orthogonaux : le triangle <b>n’est pas rectangle en ' + M('A') + '</b>.',
      'Rédaction attendue : calcul des coordonnées, calcul du produit scalaire, puis conclusion explicite avec le critère ' + M('vec{u} · vec{v} = 0 ⇔ vec{u} ⊥ vec{v}') + '.'
    ]
  };
});

G('second-degre', 'sd-parametre', 'Paramètre : racine double', 'exp', function(){

  const m = b * b / (4 * a);
  return {
    enonce: '<p>On considère l\u2019équation, d\u2019inconnue ' + M('x') + ' et de paramètre réel ' + M('m') + ' :</p>' +
            Mc(lead(a, 'x^{2}') + sgn(b, 'x') + ' + m = 0') +
            '<p>Pour quelle valeur de ' + M('m') + ' cette équation admet-elle une <b>racine double</b> ?</p>',
    champs: [{ type: 'num', label: 'm =', bon: m, tol: 1e-6 }],
    etapes: [
      'Une racine double correspond exactement à ' + M('\u0394 = 0') + '.',
      M('\u0394 = b^{2} - 4ac = (' + nf(b) + ')^{2} - 4 \u00D7 (' + nf(a) + ') \u00D7 m = ' + nf(b * b) + sgn(-4 * a, 'm')),
      'On résout ' + M(nf(b * b) + sgn(-4 * a, 'm') + ' = 0') + ' soit ' + M('m = frac{' + nf(b * b) + '}{' + nf(4 * a) + '} = ' + nf(m)) + '.',
      'La racine double vaut alors ' + M('x_0 = frac{-b}{2a} = ' + nf(-b / (2 * a))) + '.',
      '<b>Réflexe</b> : dès qu\u2019un paramètre apparaît, la question porte presque toujours sur le <b>signe de ' + M('\u0394') + '</b>.'

  };
});

G('second-degre', 'sd-bicarree', 'Équation bicarrée (changement de variable)', 'exp', function(){
  const k1 = R.int(1, 5);

  const X1 = k1 * k1;
  const X2 = deuxRacines ? R.pick([4, 9, 16, 25, 36]) : -R.int(1, 9);
  const b = -(X1 + X2), c = X1 * X2;
  const sols = deuxRacines ? 4 : 2;

  return {
    enonce: '<p>Résous dans ' + M('\u211D') + ' l\u2019équation</p>' + Mc('x^{4}' + sgn(b, 'x^{2}') + sgn(c, '') + ' = 0') +
            '<p>Combien y a-t-il de solutions, et quelle est la plus grande ?</p>',
    champs: [
      { type: 'choix', label: 'Nombre de solutions', options: ['0', '2', '3', '4'], bon: sols === 4 ? 3 : 1 },
      { type: 'num', label: 'plus grande solution', bon: plusGrande, tol: 1e-6 }
    ],
    etapes: [
      'On pose ' + M('X = x^{2}') + ' (avec nécessairement ' + M('X \u2265 0') + ') : l\u2019équation devient ' + M('X^{2}' + sgn(b, 'X') + sgn(c, '') + ' = 0') + '.',
      M('\u0394 = (' + nf(b) + ')^{2} - 4 \u00D7 ' + nf(c) + ' = ' + nf(b * b - 4 * c)) + ', donc ' + M('X_1 = ' + nf(X1)) + ' et ' + M('X_2 = ' + nf(X2)) + '.',
      deuxRacines
        ? 'Les deux valeurs sont <b>positives</b> : chacune donne deux solutions en ' + M('x') + ', à savoir ' +
          M('x = \u00B1sqrt{' + nf(X1) + '} = \u00B1' + nf(k1)) + ' et ' + M('x = \u00B1sqrt{' + nf(X2) + '} = \u00B1' + nf(Math.sqrt(X2))) + '.'
        : M('X_2 = ' + nf(X2) + ' &lt; 0') + ' est à <b>rejeter</b> : un carré ne peut pas être négatif. Seule ' + M('X_1 = ' + nf(X1)) +
          ' convient, d\u2019où ' + M('x = \u00B1' + nf(k1)) + '.',
      'Il y a donc <b>' + sols + ' solutions</b>, la plus grande étant ' + M(nf(plusGrande)) + '.',
      '<b>C\u2019est là que le piège se joue</b> : ne jamais oublier de vérifier le signe de chaque ' + M('X') + ' avant de revenir à ' + M('x') + '.'

  };
});

G('second-degre', 'sd-inequation', 'Inéquation à ramener au second degré', 'exp', function(){
  let x1 = R.nz(-5, 4), x2 = x1 + R.int(1, 5);
  if (x2 === 0) x2 = x1 + R.int(1, 5) + 1;
  const a = R.pick([1, 2, -1]);
  const b = -a * (x1 + x2), c = a * x1 * x2;
  const d = R.nz(-5, 5), e = R.int(-6, 6);      // membre de droite : dx + e
  const superieur = Math.random() < 0.5;
  /* inéquation posée :  a x² + (b+d) x + (c+e)  ≥/≤  dx + e   ⇔  a x² + bx + c ≥/≤ 0 */
  const gaucheB = b + d, gaucheC = c + e;
  const dedans = M('[ ' + nf(x1) + ' ; ' + nf(x2) + ' ]');
  const dehors = M('] -\u221E ; ' + nf(x1) + ' ] \u222A [ ' + nf(x2) + ' ; +\u221E [');
  /* a>0 : trinôme ≥ 0 à l'extérieur ; a<0 : ≥ 0 entre les racines */
  const bonEstDehors = superieur ? (a > 0) : (a < 0);
  return {
    enonce: '<p>Résous dans ' + M('\u211D') + ' l\u2019inéquation</p>' +
            Mc(trinome(a, gaucheB, gaucheC) + (superieur ? ' \u2265 ' : ' \u2264 ') + lead(d, 'x') + (e ? sgn(e, '') : '')),
    qcm: {
      options: [dedans, dehors, 'Aucune solution', 'Tous les réels'],
      bon: bonEstDehors ? 1 : 0
    },
    etapes: [
      '<b>Étape 1</b> — tout ramener d\u2019un même côté : ' +
        M(trinome(a, gaucheB, gaucheC) + ' - (' + lead(d, 'x') + (e ? sgn(e, '') : '') + ')' + (superieur ? ' \u2265 ' : ' \u2264 ') + '0') +
        ' soit ' + M(trinome(a, b, c) + (superieur ? ' \u2265 ' : ' \u2264 ') + '0') + '.',
      '<b>Étape 2</b> — racines du trinôme : ' + M('\u0394 = ' + nf(b * b - 4 * a * c) + ' > 0') + ', ' +
        M('x_1 = ' + nf(x1)) + ' et ' + M('x_2 = ' + nf(x2)) + '.',
      '<b>Étape 3</b> — signe : ' + M('a = ' + nf(a)) + ', donc le trinôme est ' + (a > 0 ? 'positif' : 'négatif') +
        ' à l\u2019extérieur des racines et ' + (a > 0 ? 'négatif' : 'positif') + ' entre les deux.',
      '<b>Conclusion</b> : ' + (bonEstDehors ? dehors : dedans) + '. Les crochets sont <b>fermés</b> car l\u2019inégalité est large.',
      'Erreur fréquente : résoudre sans tout ramener à gauche, ou garder des crochets ouverts avec un ' + M('\u2265') + '.'
    ]
  };
});

        ' : ' + M('(v_n)') + ' est géométrique de raison ' + M('q = ' + nf(a)) + '.',

G('suites', 'su-somme-decalee', 'Somme entre deux indices', 'exp', function(){

G('suites', 'su-deux-suites', 'Comparer deux modèles', 'exp', function(){
  const a0 = R.pick([1200, 1500, 1800, 2000]);
  const r = R.pick([60, 80, 100, 120]);
  const b0 = R.pick([900, 1000, 1100]);
  const p = R.pick([6, 7, 8, 10]);
  const q = 1 + p / 100;
  let n = 0, A = a0, B = b0;
  while (B <= A && n < 500){ n++; A = a0 + n * r; B = b0 * Math.pow(q, n); }
  return {
    enonce: '<p>Deux offres pour un même service, sur ' + M('n') + ' années :</p>' +
            '<ul style="margin:8px 0 0;padding-left:20px"><li>Offre A : ' + nf(a0) + ' \u20AC la première année, puis <b>+ ' + r + ' \u20AC par an</b> ;</li>' +
            '<li>Offre B : ' + nf(b0) + ' \u20AC la première année, puis <b>+ ' + p + ' % par an</b>.</li></ul>' +
            '<p style="margin-top:10px">À partir de quelle année ' + M('n') + ' l\u2019offre B devient-elle <b>plus chère</b> que l\u2019offre A ?</p>',
    champs: [{ type: 'num', label: 'n =', bon: n, tol: 1e-9 }],
    etapes: [
      'Offre A : suite <b>arithmétique</b>, ' + M('a_n = ' + nf(a0) + ' + ' + r + 'n') + '. Offre B : suite <b>géométrique</b>, ' +
        M('b_n = ' + nf(b0) + ' \u00D7 ' + nf(q) + '^{n}') + '.',
      'Une suite géométrique de raison ' + M('q > 1') + ' finit <b>toujours</b> par dépasser une suite arithmétique : la question est « à partir de quand ».',
      'On compare année par année : ' + M('a_{' + n + '} = ' + nf(a0 + n * r)) + ' et ' + M('b_{' + n + '} \u2248 ' + nf(b0 * Math.pow(q, n), 1)) +
        ', alors qu\u2019à l\u2019année précédente ' + M('a_{' + (n - 1) + '} = ' + nf(a0 + (n - 1) * r)) + ' et ' + M('b_{' + (n - 1) + '} \u2248 ' + nf(b0 * Math.pow(q, n - 1), 1)) + '.',
      'C\u2019est donc à partir de ' + M('n = ' + n) + ' que B dépasse A.',
      'Algorithme :<pre class="code">n = 0\nA = ' + a0 + '\nB = ' + b0 + '\nwhile B &lt;= A:\n    n = n + 1\n    A = ' + a0 + ' + ' + r + '*n\n    B = ' + b0 + ' * ' + String(q) + '**n\nprint(n)</pre>'
    ]
  };
});

G('suites', 'su-algo-trace', 'Lire un algorithme', 'exp', function(){
  const u0 = R.int(2, 9), a = R.pick([2, 3]), b = R.nz(-5, 5), N = R.int(3, 6);
  let u = u0, s = u0;
  for (let i = 0; i < N; i++){ u = a * u + b; s += u; }
  const sommeDemandee = Math.random() < 0.5;
  return {
    enonce: '<p>On exécute ce programme :</p>' +
            '<pre class="code">u = ' + u0 + '\ns = u\nfor i in range(' + N + '):\n    u = ' + a + '*u ' + (b < 0 ? '- ' + (-b) : '+ ' + b) + '\n    s = s + u\n' +
            'print(' + (sommeDemandee ? 's' : 'u') + ')</pre>' +
            '<p>Qu\u2019affiche-t-il ?</p>',
    champs: [{ type: 'num', label: 'Valeur affichée', bon: sommeDemandee ? s : u, tol: 1e-9 }],
    etapes: [

G('derivation', 'de-tangente-parallele', 'Tangentes parallèles à une droite', 'exp', function(){
  let r1, r2;
  do { r1 = R.int(-4, 3); r2 = r1 + R.int(1, 4); } while ((r1 + r2) % 2 !== 0);
  const b = -3 * (r1 + r2) / 2;
  const d = R.int(-5, 5);
  const m = R.pick([-12, -9, -6, -3, 0, 3, 6, 9, 12]);
  const c = m + 3 * r1 * r2;
  const f = 'x^{3}' + (b ? sgn(b, 'x^{2}') : '') + (c ? sgn(c, 'x') : '') + (d ? sgn(d, '') : '');
  return {
    enonce: '<p>Soit ' + M('f(x) = ' + f) + ' et la droite ' + M('d : y = ' + lead(m, 'x') + ' + 7') + '.</p>' +
            '<p>En quels points la tangente à la courbe de ' + M('f') + ' est-elle <b>parallèle</b> à ' + M('d') + ' ? ' +
            'Donne les deux abscisses, dans l\u2019ordre croissant.</p>',
    champs: [
      { type: 'num', label: 'x₁ =', bon: r1, tol: 1e-6 },
      { type: 'num', label: 'x₂ =', bon: r2, tol: 1e-6 }
    ],
    etapes: [
      'Deux droites sont parallèles lorsqu\u2019elles ont le <b>même coefficient directeur</b>. Celui de la tangente en ' + M('a') + ' est ' + M('f\u2032(a)') + '.',
      'On résout donc ' + M('f\u2032(x) = ' + nf(m)) + ', avec ' + M('f\u2032(x) = 3x^{2}' + (b ? sgn(2 * b, 'x') : '') + (c ? sgn(c, '') : '')) + '.',
      M('3x^{2}' + (b ? sgn(2 * b, 'x') : '') + sgn(c - m, '') + ' = 0') + ', ' + M('\u0394 = ' + nf(4 * b * b - 12 * (c - m)) + ' > 0') + '.',
      'Les solutions sont ' + M('x_1 = ' + nf(r1)) + ' et ' + M('x_2 = ' + nf(r2)) + ' : il y a <b>deux</b> points où la tangente est parallèle à ' + M('d') + '.',
      'Remarque : l\u2019ordonnée à l\u2019origine de ' + M('d') + ' (ici 7) <b>ne sert à rien</b> — seul le coefficient directeur compte.'
    ]
  };
});

G('derivation', 'de-position-tangente', 'Position de la courbe et de sa tangente', 'exp', function(){
  const a = R.nz(-3, 3);
  const p = R.int(-5, 5), q = R.int(-5, 5);
  const f = 'x^{3}' + (p ? sgn(p, 'x') : '') + (q ? sgn(q, '') : '');
  const seuil = -2 * a;
  const au = M('] ' + nf(seuil) + ' ; +\u221E [');
  const sous = M('] -\u221E ; ' + nf(seuil) + ' [');
  return {
    enonce: '<p>Soit ' + M('f(x) = ' + f) + ' et ' + M('T') + ' la tangente à sa courbe au point d\u2019abscisse ' + M('a = ' + nf(a)) + '.</p>' +
            '<p>Sur quel intervalle la courbe de ' + M('f') + ' est-elle <b>au-dessus</b> de ' + M('T') + ' ?</p>',
    qcm: {
      options: [au, sous, 'Partout sauf en ' + M('x = ' + nf(a)), 'Nulle part'],
      bon: 0
    },
    etapes: [
      'On étudie le <b>signe de la différence</b> ' + M('f(x) - T(x)') + ' : c\u2019est toujours ainsi qu\u2019on compare une courbe et une droite.',
      'Avec ' + M('T(x) = f\u2032(' + nf(a) + ')' + fact(a) + ' + f(' + nf(a) + ')') + ', les termes en ' + M('x') + ' et les constantes se simplifient et il reste :',
      Mc('f(x) - T(x) = x^{3} - 3a^{2}x + 2a^{3} = (x - a)^{2}(x + 2a)') +
        '<p class="tiny" style="text-align:center">soit ici ' + M(fact(a) + '^{2}' + fact(-2 * a)) + '</p>',
      M(fact(a) + '^{2} ≥ 0') + ' toujours : le signe de la différence est donc <b>celui de ' + M(fact(-2 * a)) + '</b>, ' +
        'qui est positif pour ' + M('x > ' + nf(seuil)) + '.',
      'La courbe est donc au-dessus de ' + M('T') + ' sur ' + au + ' et en dessous sur ' + sous + ' (avec contact en ' + M('x = ' + nf(a)) + ').'
    ]
  };
});

G('derivation', 'de-quotient-extremum', 'Extremum d\u2019un quotient', 'exp', function(){

    ],
    etapes: [
      'On dérive avec ' + M('(frac{u}{v})\u2032 = frac{u\u2032v - uv\u2032}{v^{2}}') + ', ' + M('u(x) = x^{2} + ' + c) + ' et ' + M('v(x) = x') + ' :',
      Mc('f\u2032(x) = frac{2x \u00D7 x - (x^{2} + ' + c + ') \u00D7 1}{x^{2}} = frac{x^{2} - ' + c + '}{x^{2}}'),
      'Sur ' + M('] 0 ; +\u221E [') + ', ' + M('x^{2} > 0') + ' : le signe de ' + M('f\u2032(x)') + ' est celui de ' + M('x^{2} - ' + c) +

      M('f\u2032') + ' est <b>négative</b> sur ' + M('] 0 ; ' + k + ' [') + ' puis <b>positive</b> sur ' + M('] ' + k + ' ; +\u221E [') +
        ' : ' + M('f') + ' décroît puis croît, il y a donc un <b>minimum</b> en ' + M('x = ' + k) + '.',

});
