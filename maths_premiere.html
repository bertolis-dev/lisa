            form('P / S = σ × T<sup>4</sup>&nbsp;&nbsp;avec σ = 5,67 × 10<sup>-8</sup> W·m<sup>-2</sup>·K<sup>-4</sup>'),
    champs: [{ type: 'num', label: 'P/S (W·m⁻²)', bon: Pr, tol: Math.max(2, Pr * 0.02) }],

        ' ≈ <b>' + nf(Pr) + ' W·m<sup>-2</sup></b>.',
      'Retiens la conséquence : comme la puissance varie en T<sup>4</sup>, <b>doubler la température ' +
        'multiplie la puissance émise par 16</b>.',

/* ---------- confettis ---------- */
function confettis(force){
  if (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const cv = document.createElement('canvas');
  cv.className = 'confettis';
  cv.width = window.innerWidth; cv.height = window.innerHeight;
  document.body.appendChild(cv);
  const ctx = cv.getContext('2d');
  const couleurs = ['#2F45C5', '#E0A84B', '#0F7A54', '#C13A86', '#2F6FE0', '#D9720B'];
  const n = force === 'max' ? 140 : 70;
  const p = [];
  for (let i = 0; i < n; i++){
    p.push({
      x: cv.width * (0.2 + 0.6 * Math.random()),
      y: cv.height * 0.32 + Math.random() * 40,
      vx: (Math.random() - 0.5) * 11,
      vy: -7 - Math.random() * 11,
      l: 5 + Math.random() * 7,
      a: Math.random() * Math.PI,
      va: (Math.random() - 0.5) * 0.35,
      c: couleurs[Math.floor(Math.random() * couleurs.length)]
    });
  }
  let t = 0;
  (function boucle(){
    t++;
    ctx.clearRect(0, 0, cv.width, cv.height);
    p.forEach(o => {
      o.vy += 0.32; o.x += o.vx; o.y += o.vy; o.a += o.va;
      ctx.save();
      ctx.translate(o.x, o.y); ctx.rotate(o.a);
      ctx.globalAlpha = Math.max(0, 1 - t / 110);
      ctx.fillStyle = o.c;
      ctx.fillRect(-o.l / 2, -o.l / 4, o.l, o.l / 2);
      ctx.restore();
    });
    if (t < 110) requestAnimationFrame(boucle); else cv.remove();
  })();
}

let audioCtx = null;
function bip(genre){
  if (!S.son) return;
  try {
    audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
    const notes = genre === 'juste' ? [660, 880] : genre === 'badge' ? [660, 880, 1100, 1320] : [200, 160];
    notes.forEach((f, i) => {
      const o = audioCtx.createOscillator(), g = audioCtx.createGain();
      o.type = genre === 'faux' ? 'sine' : 'triangle';
      o.frequency.value = f;
      const t0 = audioCtx.currentTime + i * 0.085;
      g.gain.setValueAtTime(0.0001, t0);
      g.gain.exponentialRampToValueAtTime(0.13, t0 + 0.012);
      g.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.17);
      o.connect(g); g.connect(audioCtx.destination);
      o.start(t0); o.stop(t0 + 0.2);
    });
  } catch (e) { /* le son n'est jamais indispensable */ }
}

/* =========================================================================
   Évaluations : un vrai devoir surveillé — plusieurs exercices, un barème,
   une durée, aucune correction pendant l'épreuve. À la fin : la copie
   corrigée, la note sur 20, et l'historique des notes.
   ========================================================================= */

const BAREME = { app: 2, ent: 3, ds: 5, exp: 6, demo: 8 };
const MINUTES = { app: 5, ent: 7, ds: 10, exp: 12, demo: 15 };

let dsEnCours = null, tickDS = null;

function composerSujet(){
  const pool = poolRevision();
  if (pool.length < 3) return null;
  const par = n => pool.filter(g => g.niveau === n);
  const choix = [];
  const prendre = (n, k) => R.shuffle(par(n)).slice(0, k).forEach(g => { if (choix.indexOf(g) < 0) choix.push(g); });
  prendre('app', 1); prendre('ent', 2); prendre('ds', 1); prendre('exp', 1); prendre('demo', 1);
  R.shuffle(pool).forEach(g => { if (choix.length < 5 && choix.indexOf(g) < 0) choix.push(g); });
  /* les démonstrations en dernier, comme dans un vrai sujet */
  return choix.slice(0, 5).sort((a, b) => (a.niveau === 'demo' ? 1 : 0) - (b.niveau === 'demo' ? 1 : 0));
}

function lancerEvaluation(){
  const gens = composerSujet();
  if (!gens) return;
  const questions = gens.map(g => {
    const q = g.fn();
    q.gen = g;
    q.bar = BAREME[g.niveau] || 3;
    if (q.qcm){
      const idx = R.shuffle(q.qcm.options.map((o, i) => i));
      q.qcm.options = idx.map(i => q.qcm.options[i]);
      q.qcm.bon = idx.indexOf(q.qcm.bon);
      q.choix = null;
    }
    if (q.bareme) q.coches = q.bareme.map(() => false);
    return q;
  });
  const minutes = questions.reduce((t, q) => t + (MINUTES[q.gen.niveau] || 7), 0);
  dsEnCours = {
    questions: questions, idx: 0, debut: Date.now(),
    duree: minutes * 60, reste: minutes * 60,
    total: questions.reduce((t, q) => t + q.bar, 0),
    rendu: false, note: null
  };
  clearInterval(tickDS);
  tickDS = setInterval(() => {
    if (!dsEnCours || dsEnCours.rendu){ clearInterval(tickDS); return; }
    dsEnCours.reste--;
    const el = document.getElementById('chronoDS');
    if (el){ el.textContent = mmss(dsEnCours.reste); el.classList.toggle('warn', dsEnCours.reste <= 300); }
    if (dsEnCours.reste <= 0){ clearInterval(tickDS); rendreCopie(); }
  }, 1000);
  aller({ nom: 'ds' });
}

function lireReponsesDS(){
  const q = dsEnCours.questions[dsEnCours.idx];
  if (!q.champs) return;
  q.champs.forEach((f, i) => {
    if (f.type === 'choix') return;

function pointsQuestion(q){
  if (q.bareme){
    const tot = q.bareme.reduce((t, b) => t + b.pts, 0);
    const eus = q.bareme.reduce((t, b, j) => t + (q.coches[j] ? b.pts : 0), 0);
    return tot ? Math.round(10 * q.bar * eus / tot) / 10 : 0;
  }
  if (q.qcm) return q.choix === q.qcm.bon ? q.bar : 0;
  const n = q.champs.length, bons = q.champs.filter(champOk).length;
  return Math.round(10 * q.bar * bons / n) / 10;
}
function appreciation(n){
  if (n >= 18) return 'Remarquable 🏆';
  if (n >= 15) return 'Très bien 🎉';
  if (n >= 12) return 'Bien 💪';
  if (n >= 10) return 'Assez bien 🙂';
  if (n >= 7)  return 'Des bases, mais il faut consolider 🌱';
  return 'Reprends le cours et refais des séries 📖';
}
function calculerNote(){
  const d = dsEnCours;
  let obtenu = 0;
  d.questions.forEach(q => {
    const p = pointsQuestion(q);
    obtenu += p;
    const part = q.bar ? p / q.bar : 0;
    enregistrer(q.gen.id, part >= 0.7, part);
  });
  d.note = Math.round(2 * 20 * obtenu / d.total) / 2;      /* au demi-point */
  d.detail = nf(Math.round(obtenu * 10) / 10) + ' points sur ' + d.total + ' · ' +
             d.questions.filter(q => pointsQuestion(q) === q.bar).length + ' exercice(s) parfaitement traité(s) sur ' + d.questions.length + '.';
  S.notes = S.notes || [];
  S.notes.push({ t: Date.now(), note: d.note, matiere: S.matiere, duree: Math.round((Date.now() - d.debut) / 1000) });
  if (S.notes.length > 40) S.notes = S.notes.slice(-40);
  sauver();
  const gagnes = nouveauxBadges({ noteMax: d.note });
  rendre();
  if (d.note >= 14) confettis(d.note >= 18 ? 'max' : '');
  bip(d.note >= 10 ? 'badge' : 'faux');
  if (gagnes.length) setTimeout(() => feterBadges(gagnes), 700);
}

/* =========================================================================
   LE DÉFI DU JOUR
   Dix questions tirées au sort dans toutes les matières que l'élève a
   sélectionnées. Le tirage est déterministe pour la journée : le défi est
   le même toute la journée, et change à minuit.
   Chrono par question, bonus de rapidité, combo, médaille, série de jours.
   Les bonnes réponses alimentent l'XP et la révision espacée comme
   n'importe quel exercice.
   ========================================================================= */

const DEFI_N = 10;                 /* nombre de questions */
const DEFI_T_QCM = 20;             /* secondes pour un QCM */
const DEFI_T_NUM = 35;             /* secondes pour un calcul */
const DEFI_MEDAILLES = [
  { min: 200, e: '🥇', nom: 'médaille d’or' },
  { min: 140, e: '🥈', nom: 'médaille d’argent' },
  { min: 80,  e: '🥉', nom: 'médaille de bronze' }
];

/* générateur pseudo-aléatoire reproductible, pour figer le défi du jour */
function defiSeed(txt){
  let h = 2166136261;
  for (let i = 0; i < txt.length; i++){ h ^= txt.charCodeAt(i); h = Math.imul(h, 16777619); }
  return h >>> 0;
}
function defiRandom(seed){
  let s = seed >>> 0;
  return function(){ s = (Math.imul(s, 1664525) + 1013904223) >>> 0; return s / 4294967296; };
}

function defiEtat(){
  S.defi = S.defi || { jour: '', score: 0, meilleur: 0, jours: 0, recordJours: 0, dernier: '' };
  return S.defi;
}

/* toutes les questions candidates : matières choisies, prêtes, hors rédactions */
function defiPool(){
  const cl = classeCourante().id;
  const out = [];
  MATIERES.filter(m => m.pret && S.mesMatieres.indexOf(m.id) >= 0).forEach(m => {
    CHAPITRES.filter(c => c.matiere === m.id && c.classe === cl).forEach(c => {
      (c.gens || []).forEach(g => { if (!g.demo) out.push({ g: g, mat: m }); });
    });
  });
  return out;
}

/* compose le défi en répartissant les questions entre les matières */
function defiComposer(seed){
  const pool = defiPool();
  if (!pool.length) return null;
  const rnd = defiRandom(seed);

  const parMat = {};
  pool.forEach(x => { (parMat[x.mat.id] = parMat[x.mat.id] || []).push(x); });
  const mats = Object.keys(parMat);
  const choisis = [];
  let garde = 0;
  while (choisis.length < DEFI_N && garde++ < 600){
    const lot = parMat[mats[choisis.length % mats.length]];
    const cand = lot[Math.floor(rnd() * lot.length)];
    if (!choisis.some(x => x.g.id === cand.g.id)) choisis.push(cand);
    else if (garde > 300) choisis.push(cand);      /* peu de générateurs : on autorise un doublon */
  }

  /* on fabrique les énoncés avec ce même hasard, pour que le défi soit figé */
  const vrai = Math.random;
  const questions = [];
  try {
    Math.random = rnd;
    choisis.forEach(x => {
      let q;
      try { q = x.g.fn(); } catch (e) { return; }
      if (!q || (!q.qcm && !q.champs)) return;
      if (q.qcm){
        const idx = q.qcm.options.map((o, i) => i);
        for (let i = idx.length - 1; i > 0; i--){
          const j = Math.floor(rnd() * (i + 1));
          const t = idx[i]; idx[i] = idx[j]; idx[j] = t;
        }
        q.qcm.options = idx.map(i => q.qcm.options[i]);
        q.qcm.bon = idx.indexOf(q.qcm.bon);
      }
      questions.push({ q: q, mid: x.g.id, mat: x.mat, chap: CHAP[x.g.chap] });
    });
  } finally { Math.random = vrai; }
  return questions.length ? questions : null;
}

let defi = null, defiTick = null;

function defiArreter(){ if (defiTick){ clearInterval(defiTick); defiTick = null; } }

function lancerDefi(entrainement){
  const seed = defiSeed(aujourdhui() + '|' + S.mesMatieres.join(',') +
                        (entrainement ? '|libre|' + Date.now() : ''));
  const qs = defiComposer(seed);
  if (!qs) return;
  defiArreter();
  defi = {
    qs: qs, i: 0, score: 0, justes: 0, combo: 0, meilleurCombo: 0,
    reste: 0, total: 0, fini: false, repondu: false,
    entrainement: !!entrainement, dernier: null, detail: []
  };
  vue = { nom: 'defi' };
  fermerMenu();
  defiQuestion();
  window.scrollTo(0, 0);
  rendre();
}

function defiQuestion(){
  const c = defi.qs[defi.i];
  defi.total = c.q.qcm ? DEFI_T_QCM : DEFI_T_NUM;
  defi.reste = defi.total;
  defi.repondu = false;
  defiArreter();
  defiTick = setInterval(function(){
    if (!defi || defi.repondu || defi.fini) return;
    defi.reste--;
    const b = document.getElementById('defi-chrono');
    if (b) b.style.width = Math.max(0, defi.reste / defi.total * 100) + '%';
    const n = document.getElementById('defi-sec');
    if (n) n.textContent = defi.reste;
    if (defi.reste <= 0) defiValider(true);
  }, 1000);
}

/* valide la question courante ; tempsEcoule = true si le chrono a expiré */
function defiValider(tempsEcoule){
  if (!defi || defi.repondu) return;
  const c = defi.qs[defi.i], q = c.q;
  let juste = false;
  if (!tempsEcoule){
    if (q.qcm) juste = (q.choix === q.qcm.bon);
    else {
      q.champs.forEach((f, i) => {
        if (f.type === 'choix') return;
        const el = document.getElementById('df' + i);
        if (el) f.saisie = el.value;
      });
      juste = q.champs.every(champOk);
    }
  }
  defi.repondu = true;
  defiArreter();

  let gagne = 0;
  if (juste){
    defi.justes++;
    defi.combo++;
    if (defi.combo > defi.meilleurCombo) defi.meilleurCombo = defi.combo;
    gagne = 10;
    const part = defi.reste / defi.total;
    if (part > 0.66) gagne += 5; else if (part > 0.33) gagne += 3;
    if (defi.combo >= 2) gagne += Math.min(10, 2 * (defi.combo - 1));
    defi.score += gagne;
    bip('juste');
  } else {
    defi.combo = 0;
    bip('faux');
  }
  defi.dernier = { juste: juste, gagne: gagne, temps: !!tempsEcoule };
  defi.detail[defi.i] = { mat: c.mat.court, juste: juste };
  enregistrer(c.mid, juste);
  rendre();
}

function defiSuivante(){
  if (!defi) return;
  if (defi.i >= defi.qs.length - 1){ defiFinir(); return; }
  defi.i++;
  defiQuestion();
  window.scrollTo(0, 0);
  rendre();
}

function defiFinir(){
  defiArreter();
  defi.fini = true;
  const e = defiEtat();
  if (!defi.entrainement && e.jour !== aujourdhui()){
    e.jour = aujourdhui();
    e.score = defi.score;
    if (defi.score > (e.meilleur || 0)) e.meilleur = defi.score;
    e.jours = (e.dernier === hier()) ? (e.jours || 0) + 1 : 1;
    if (e.jours > (e.recordJours || 0)) e.recordJours = e.jours;
    e.dernier = aujourdhui();
    sauver();
    if (defi.score >= 140) confettis();
    const nouv = typeof nouveauxBadges === 'function' ? nouveauxBadges() : [];
    if (nouv && nouv.length && typeof feterBadges === 'function') feterBadges(nouv);
  }
  rendre();
}

function defiMedaille(score){
  for (let i = 0; i < DEFI_MEDAILLES.length; i++) if (score >= DEFI_MEDAILLES[i].min) return DEFI_MEDAILLES[i];
  return null;
}
function messageDefi(justes){
  if (justes >= 10) return 'Sans faute. Rien à ajouter.';
  if (justes >= 8)  return 'Excellent : tu tiens la distance sur toutes les matières.';
  if (justes >= 6)  return 'Bon défi. Les erreurs montrent exactement où réviser.';
  if (justes >= 4)  return 'C’est un début. Reviens demain, ça monte vite.';
  return 'Journée difficile. Le prochain défi sera plus clément.';
}

    h += '<div class="stats">' +

      '<div class="stat"><div class="v">' + (e.recordJours || 0) + '</div><div class="k">record de série</div></div>' +
      '</div>';

        '<span class="pastille">' + m.e + ' ' + m.court + '</span>').join('') + '</div>' +
      '<p class="tiny">Le tirage suit les matières cochées dans « Mes matières ». ' +
      pool.length + ' types de questions peuvent tomber aujourd’hui.</p></div>';

    h += '<div class="card"><h3>Comment ça marche</h3><ul class="regles">' +
      '<li><b>10 points</b> par bonne réponse.</li>' +
      '<li><b>+5</b> si tu réponds très vite, <b>+3</b> si tu réponds vite.</li>' +
      '<li><b>Combo</b> : jusqu’à <b>+10</b> de plus par bonne réponse enchaînée.</li>' +
      '<li>Médailles : 🥉 dès 80 points · 🥈 dès 140 · 🥇 dès 200.</li>' +
      '<li>Le défi est le <b>même toute la journée</b>. Il change à minuit.</li></ul></div>';

    if (fait){
      const m = defiMedaille(e.score);
      h += '<div class="card"><h3>Défi d’aujourd’hui terminé ' + (m ? m.e : '') + '</h3>' +
        '<p>Tu as marqué <b>' + e.score + ' points</b>. Le prochain défi arrive demain.</p>' +
        '<div class="actions"><button class="btn primary" data-defi="entrainement">Rejouer pour s’entraîner</button></div>' +
        '<p class="tiny">Une partie d’entraînement ne compte pas dans la série, mais elle fait gagner de l’XP.</p></div>';
    } else {
      h += '<div class="actions"><button class="btn primary" data-defi="go">Lancer le défi du jour</button></div>';
    }
    main.innerHTML = h;
    return h;
  }

  /* ---- écran de fin ---- */
  if (defi.fini){
    const m = defiMedaille(defi.score);
    const parMat = {};
    defi.detail.forEach(d => {
      if (!d) return;
      parMat[d.mat] = parMat[d.mat] || { ok: 0, tot: 0 };
      parMat[d.mat].tot++; if (d.juste) parMat[d.mat].ok++;
    });
    let h = '<div class="chead" data-bloc="defi"><div class="eyebrow">' +
      (defi.entrainement ? 'Entraînement terminé' : 'Défi du jour terminé') + '</div>' +
      '<h2>' + (m ? m.e + ' ' + m.nom.charAt(0).toUpperCase() + m.nom.slice(1) : '🎯 Terminé') + '</h2>' +
      '<p class="lede">' + messageDefi(defi.justes) + '</p></div>';
    h += '<div class="stats">' +
      '<div class="stat"><div class="v">' + defi.score + '</div><div class="k">points</div></div>' +
      '<div class="stat"><div class="v">' + defi.justes + ' / ' + defi.qs.length + '</div><div class="k">bonnes réponses</div></div>' +
      '<div class="stat"><div class="v">' + defi.meilleurCombo + '</div><div class="k">meilleur combo</div></div>' +
      '</div>';
    h += '<div class="card"><h3>Matière par matière</h3><div class="defi-bilan">' +
      Object.keys(parMat).map(k => '<div class="db-ligne"><span>' + k + '</span>' +
        '<b>' + parMat[k].ok + ' / ' + parMat[k].tot + '</b></div>').join('') + '</div></div>';
    const suiv = DEFI_MEDAILLES.filter(x => x.min > defi.score).pop();
    if (suiv) h += '<div class="card"><p>Encore <b>' + (suiv.min - defi.score) +
      ' points</b> et tu décrochais la ' + suiv.nom + ' ' + suiv.e + '.</p></div>';
    h += '<div class="actions"><button class="btn primary" data-defi="entrainement">Rejouer</button>' +
         '<button class="btn ghost" data-defi="quitter">Revenir au défi</button></div>';
    main.innerHTML = h;
    return h;
  }

  /* ---- écran de question ---- */
  const c = defi.qs[defi.i], q = c.q;
  let h = '<div class="defi-tete">' +
    '<div class="defi-points">' + defi.qs.map((x, i) => {
      const d = defi.detail[i];
      return '<i class="' + (d ? (d.juste ? 'ok' : 'ko') : (i === defi.i ? 'now' : '')) + '"></i>';
    }).join('') + '</div>' +
    '<div class="defi-score">' + defi.score + ' pts' +
      (defi.combo >= 2 ? ' <span class="combo">combo ×' + defi.combo + '</span>' : '') + '</div></div>';

  h += '<div class="defi-barre' + (defi.repondu ? ' fige' : '') + '">' +
       '<span id="defi-chrono" style="width:' + Math.max(0, defi.reste / defi.total * 100) + '%"></span></div>' +
       '<div class="defi-sec">' + (defi.repondu ? 'question ' + (defi.i + 1) + ' sur ' + defi.qs.length
         : '<span id="defi-sec">' + defi.reste + '</span> s') + '</div>';

  h += '<div class="card defi-q">' +
    '<div class="defi-origine">' + c.mat.e + ' ' + c.mat.court + ' · ' + c.chap.titre + '</div>' +
    q.enonce;

  if (q.qcm){
    h += '<div class="choices">' + q.qcm.options.map((o, i) => {
      let cl = 'choice' + (q.choix === i ? ' sel' : '');
      if (defi.repondu){
        if (i === q.qcm.bon) cl += ' good';
        else if (q.choix === i) cl += ' bad';
      }
      return '<button class="' + cl + '" data-defichoix="' + i + '"' + (defi.repondu ? ' disabled' : '') + '>' +
             '<span class="k">' + 'ABCD'[i] + '</span><span>' + o + '</span></button>';
    }).join('') + '</div>';
  } else {
    h += '<div class="fields">' + q.champs.map((f, i) => {
      if (f.type === 'choix'){
        return '<div class="field"><label>' + f.label + '</label><div class="seg">' +
          f.options.map((o, j) => '<button class="' + (f.saisie === j ? 'on' : '') +
            '" data-defichamp="' + i + '" data-defival="' + j + '"' + (defi.repondu ? ' disabled' : '') + '>' +
            o + '</button>').join('') + '</div>' +
          (defi.repondu ? verdictChamp(f, f.saisie === f.bon) : '') + '</div>';
      }
      return '<div class="field"><label for="df' + i + '">' + f.label + '</label>' +
        '<input id="df' + i + '" type="text" inputmode="decimal" autocomplete="off" value="' +
        (f.saisie === undefined ? '' : esc(f.saisie)) + '"' + (defi.repondu ? ' disabled' : '') + '>' +
        (defi.repondu ? verdictChamp(f, champOk(f)) : '') + '</div>';
    }).join('') + '</div>';
  }

  if (!defi.repondu){
    if (!q.qcm) h += '<div class="actions"><button class="btn primary" data-defivalider="1">Valider</button>' +
                     '<button class="btn ghost" data-defipasser="1">Passer</button></div>';
  } else {
    const d = defi.dernier;
    h += '<div class="verdict ' + (d.juste ? 'ok' : 'ko') + '">' +
      '<div class="vh"><span class="ve">' + (d.juste ? '🎯' : (d.temps ? '⏱️' : '💡')) + '</span>' +
      (d.juste ? 'Juste' : (d.temps ? 'Temps écoulé' : 'Pas tout à fait')) +
      (d.juste && d.gagne ? '<span class="gain">+' + d.gagne + ' pts</span>' : '') + '</div></div>';
    h += '<div class="sol"><h4>Correction détaillée</h4><div class="steps">' +
      (q.etapes || []).map(s => '<div class="step"><div>' + s + '</div></div>').join('') + '</div></div>';
    h += '<div class="actions"><button class="btn primary" data-defisuivante="1">' +
      (defi.i >= defi.qs.length - 1 ? 'Voir mon résultat' : 'Question suivante') + '</button></div>';
  }
  h += '</div>';

  main.innerHTML = h;
  if (!defi.repondu && !q.qcm){
    const f0 = document.getElementById('df0');
    if (f0) f0.focus();
  }
  return h;
}

/* ---------------- interactions propres au défi ---------------- */
document.addEventListener('click', function(ev){
  const t = ev.target.closest('[data-defi],[data-defichoix],[data-defichamp],[data-defivalider],[data-defipasser],[data-defisuivante]');
  if (!t) return;
  const d = t.dataset;
  if (d.defi === 'vue'){ defiArreter(); defi = null; vue = { nom: 'defi' }; fermerMenu(); window.scrollTo(0, 0); rendre(); return; }
  if (d.defi === 'go'){ lancerDefi(false); return; }
  if (d.defi === 'entrainement'){ lancerDefi(true); return; }
  if (d.defi === 'quitter'){ defiArreter(); defi = null; rendre(); return; }
  if (!defi) return;
  if (d.defichoix !== undefined){
    if (defi.repondu) return;
    defi.qs[defi.i].q.choix = +d.defichoix;
    defiValider(false);
    return;
  }
  if (d.defichamp !== undefined){
    if (defi.repondu) return;
    defi.qs[defi.i].q.champs[+d.defichamp].saisie = +d.defival;
    rendre();
    return;
  }
  if (d.defivalider){ defiValider(false); return; }
  if (d.defipasser){ defiValider(true); return; }
  if (d.defisuivante){ defiSuivante(); return; }
});
document.addEventListener('keydown', function(ev){
  if (ev.key !== 'Enter' || !defi || defi.fini || vue.nom !== 'defi') return;
  if (defi.repondu) defiSuivante();
  else if (!defi.qs[defi.i].q.qcm) defiValider(false);
});

function estActif(id){

/* version affichée et mise à jour forcée : une application installée garde
   parfois une version en mémoire, ce bouton la remet à neuf */
function ligneVersion(){
  return '<button class="version" data-maj="1" title="Forcer la mise à jour">' +
         'Version ' + VERSION_APP + '<span>Toucher pour mettre à jour</span></button>';
}
async function forcerMiseAJour(){
  try {
    if (navigator.serviceWorker){
      const rs = await navigator.serviceWorker.getRegistrations();
      await Promise.all(rs.map(r => r.unregister()));
    }
    if (window.caches){
      const ks = await caches.keys();
      await Promise.all(ks.map(k => caches.delete(k)));
    }
  } catch (e) {}
  location.replace(location.pathname + '?maj=' + Date.now());
}

function tirer(pool, n){
  if (!pool.length) return [];
  const now = Date.now();
  const prio = pool.filter(g => { const m = S.methodes[g.id]; return m && m.ko > 0 && m.due <= now; });
  const neufs = pool.filter(g => !S.methodes[g.id]);
  const autres = pool.filter(g => prio.indexOf(g) < 0 && neufs.indexOf(g) < 0);
  let liste = R.shuffle(prio).concat(R.shuffle(neufs)).concat(R.shuffle(autres));
  while (liste.length < n) liste = liste.concat(R.shuffle(pool));
  return liste.slice(0, n);
}
function lancerSerie(pool, n, mode, titre, secondes){
  if (!pool.length) return;
  serie = {
    gens: tirer(pool, n), idx: 0, mode: mode, titre: titre,
    resultats: [], q: null, valide: false, reste: secondes || 0, debut: Date.now()
  };
  clearInterval(tickChrono);
  if (secondes){
    tickChrono = setInterval(() => {
      if (!serie){ clearInterval(tickChrono); return; }
      serie.reste--;
      const el = document.getElementById('chrono');
      if (el){ el.textContent = mmss(serie.reste); el.classList.toggle('warn', serie.reste <= 60); }
      if (serie.reste <= 0){ clearInterval(tickChrono); aller({ nom: 'bilan' }); }
    }, 1000);
  }
  prochaine();
  aller({ nom: 'serie' });
}
function mmss(s){ s = Math.max(0, s); return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0'); }
function prochaine(){
  const g = serie.gens[serie.idx];
  const q = g.fn();
  q.gen = g;
  if (q.qcm){
    const idx = R.shuffle(q.qcm.options.map((o, i) => i));
    q.qcm.options = idx.map(i => q.qcm.options[i]);
    q.qcm.bon = idx.indexOf(q.qcm.bon);
  }
  q.choix = null;
  if (q.bareme) q.coches = q.bareme.map(() => false);
  serie.q = q;
  serie.valide = false;
  serie.juste = null;
  serie.note = undefined;
}

function verdictChamp(f, ok){
  if (ok) return '<span class="tiny" style="color:var(--juste);font-weight:700">✓</span>';
  const att = f.type === 'choix' ? f.options[f.bon] : nf(f.bon);
  return '<span class="tiny" style="color:var(--faux);font-weight:700">✗ attendu : ' + att + '</span>';
}
function champOk(f){
  if (f.type === 'choix') return f.saisie === f.bon;
  const v = String(f.saisie === undefined ? '' : f.saisie).trim().replace(/\s/g, '').replace(',', '.');
  if (v === '') return false;
  const x = Number(v);
  if (!isFinite(x)) return false;
  return Math.abs(x - f.bon) <= (f.tol === undefined ? 1e-6 : f.tol);
}
function lireChamps(){
  const q = serie.q;
  if (q.qcm || !q.champs) return;      /* une démonstration n'a pas de champs */
  q.champs.forEach((f, i) => {
    if (f.type === 'choix') return;
    const el = document.getElementById('f' + i);
    if (el) f.saisie = el.value;
  });
}
function verifier(abandon){
  const q = serie.q;
  lireChamps();
  let juste;
  if (q.bareme) return;                /* une démonstration se valide par l'auto-évaluation */
  if (q.qcm) juste = (q.choix === q.qcm.bon);
  else juste = q.champs.every(champOk);
  if (abandon) juste = false;
  const rangAvant = rang(xpTotal(), RANGS).index;
  serie.abandon = !!abandon;
  serie.valide = true;
  serie.juste = juste;
  serie.resultats[serie.idx] = juste;
  const r = enregistrer(q.gen.id, juste);
  serie.gain = r.gain;
  serie.gains = (serie.gains || 0) + r.gain;
  serie.msg = juste
    ? (r.revanche ? 'Tu l’avais ratée la dernière fois. Plus maintenant !'
       : (q.gen.niveau === 'exp' ? 'Chapeau ! Celle-là était coriace.'
          : (serie.gain > POINTS[q.gen.niveau] ? unDe(MSG_JUSTE) + ' Bonus de série.' : unDe(MSG_JUSTE))))
    : unDe(MSG_FAUX);
  serie.emo = juste ? (r.revanche ? '🔁' : unDe(EMO_JUSTE)) : '💡';
  bip(juste ? 'juste' : 'faux');
  rendre();
  const gagnes = nouveauxBadges({ revanche: r.revanche });
  const rangApres = rang(xpTotal(), RANGS).index;
  if (rangApres > rangAvant){ feterRang(RANGS[rangApres].nom); rendreNav(); }
  if (gagnes.length) setTimeout(() => feterBadges(gagnes), rangApres > rangAvant ? 1400 : 0);
  else if (juste && S.serie >= 5 && S.serie % 5 === 0) confettis();
}
function suivante(){
  if (serie.idx + 1 >= serie.gens.length){ aller({ nom: 'bilan' }); return; }
  serie.idx++;
  prochaine();
  rendre();
  window.scrollTo(0, 0);
}

/* ---------------- bilan ---------------- */
function vueBilan(){
  clearInterval(tickChrono);
  const ok = serie.resultats.filter(r => r === true).length;
  const tot = serie.gens.length;
  const faits = serie.resultats.filter(r => r !== undefined).length;
  const duree = Math.round((Date.now() - serie.debut) / 1000);
  const rates = serie.gens.filter((g, i) => serie.resultats[i] === false);
  const pc = faits ? Math.round(100 * ok / faits) : 0;
  const fin = motDeFin(pc);
  if (!serie.bilanFait){
    serie.bilanFait = true;
    const gagnes = nouveauxBadges({ serieParfaite: (ok === tot && faits === tot), chronoOk: serie.mode === 'chrono' ? ok : 0 });
    if (pc >= 70) setTimeout(() => confettis(pc === 100 ? 'max' : ''), 200);
    if (gagnes.length) setTimeout(() => feterBadges(gagnes), 900);
  }
  const xp = xpTotal(), rg = rang(xp, RANGS);
  let h = '<div class="run"><div class="card bilan">' +
    '<div class="eyebrow">' + esc(serie.titre) + '</div>' +
    '<div class="bemo">' + fin.e + '</div>' +
    '<div class="score">' + ok + '<span class="sur"> / ' + tot + '</span></div>' +
    '<div class="gain-total">+ ' + (serie.gains || 0) + ' points</div>' +
    '<p class="lede" style="margin:12px auto 0;text-align:center">' + fin.t + '</p>' +
    '<p class="tiny" style="margin-top:6px">Durée : ' + mmss(duree) + (faits < tot ? ' &middot; ' + (tot - faits) + ' question(s) non traitée(s)' : '') + '</p>' +
    '<div class="bilan-rank"><div class="rank-top" style="margin-bottom:6px"><b>' + rg.nom + '</b><span class="tiny">' + xp + ' pts</span></div>' +
    '<div class="bar" style="height:7px"><span style="width:' + rg.pc + '%"></span></div>' +
    '<p class="tiny" style="margin-top:6px">' + (rg.prochain ? (rg.prochain.min - xp) + ' points avant le rang ' + rg.prochain.nom : 'Rang maximal atteint') + '</p></div>';
  if (rates.length){
    const uniques = [];
    rates.forEach(g => { if (uniques.indexOf(g) < 0) uniques.push(g); });
    h += '<div class="revue" style="margin-top:22px;text-align:left">' +
      uniques.map(g => '<div class="rev"><span>' + esc(g.label) + '</span><span class="ch">' + CHAP[g.chap].titre + '</span></div>').join('') +
      '</div><p class="tiny" style="margin-top:10px">Ces notions reviendront automatiquement dans « Réviser ».</p>';
  }
  h += '<div class="actions" style="justify-content:center;margin-top:24px">' +
    '<button class="btn primary" data-refaire="1">Refaire une série</button>' +
    '<button class="btn" data-go="accueil">Retour à l’accueil</button></div>';
  h += '</div></div>';
  elMain.innerHTML = h;
  elTop.textContent = 'Bilan';
}

/* ---------------- rendu global + événements ---------------- */
function rendre(){
  if (vue.nom === 'accueil') vueAccueil();
  else if (vue.nom === 'programme') vueProgramme();
  else if (vue.nom === 'matieres') vueMatieres();
  else if (vue.nom === 'ds') vueDS();
  else if (vue.nom === 'copie') vueCopie();
  else if (vue.nom === 'notes') vueNotes();
  else if (vue.nom === 'bientot') vueBientot();
  else if (vue.nom === 'chapitre') vueChapitre();
  else if (vue.nom === 'serie') vueSerie();
  else if (vue.nom === 'bilan') vueBilan();
  else if (vue.nom === 'defi') vueDefi();
  rendreNav();
}

document.addEventListener('click', function(e){
  const t = e.target.closest('[data-maj],[data-ouvrir],[data-corrige],[data-coched],[data-autoeval],[data-eval],[data-dsq],[data-dschoix],[data-dschamp],[data-dsrendre],[data-coche],[data-noter],[data-mat],[data-prendre],[data-son],[data-go],[data-chap],[data-onglet],[data-statut],[data-serie],[data-choix],[data-champ],[data-verifier],[data-sechapper],[data-suivante],[data-quitter],[data-refaire]');
  if (e.target.closest('#burger')){ ouvrirMenu(); return; }
  if (!t) return;
  const d = t.dataset;
  if (d.go){
    if (d.go === 'revision'){
      const pool = poolRevision();
      if (!pool.length) return;
      lancerSerie(pool, 10, 'revision', 'Révision');
    } else if (d.go === 'chrono'){
      const pool = poolRevision();
      if (!pool.length) return;
      lancerSerie(pool, 10, 'chrono', 'Interro chrono', 900);
    } else aller({ nom: d.go });
    return;
  }
  if (d.ouvrir){
    const m = MAT[d.ouvrir];
    const ouverte = (S.navOuv === undefined) ? S.matiere : S.navOuv;
    if (!m.pret){ aller({ nom: 'bientot', id: d.ouvrir }); return; }
    if (m.id === ouverte){ S.navOuv = null; }
    else { S.navOuv = m.id; if (S.matiere !== m.id){ S.matiere = m.id; aller({ nom: 'accueil' }); return; } }
    sauver(); rendreNav(); return;
  }
  if (d.mat){
    if (d.mat === '+'){ aller({ nom: 'matieres' }); return; }
    const m = MAT[d.mat];
    if (m && m.pret){ S.matiere = d.mat; S.navOuv = d.mat; sauver(); aller({ nom: 'accueil' }); }
    else aller({ nom: 'bientot', id: d.mat });
    return;
  }
  if (d.prendre){
    const i = S.mesMatieres.indexOf(d.prendre);
    if (i >= 0){ if (d.prendre !== 'maths') S.mesMatieres.splice(i, 1); }
    else S.mesMatieres.push(d.prendre);
    sauver(); rendre(); return;
  }
  if (d.chap){ aller({ nom: 'chapitre', id: d.chap, onglet: 'cours' }); return; }
  if (d.onglet){ vue.onglet = d.onglet; window.scrollTo(0, 0); rendre(); return; }
  if (d.maj){ forcerMiseAJour(); return; }
  if (d.son){
    S.son = !S.son;
    sauver();
    if (S.son) bip('juste');
    rendre();
    return;
  }
  if (d.statut){
    const id = vue.id;
    S.statuts[id] = d.statut;
    if (d.statut === 'encours') S.courant = id;
    else if (S.courant === id && d.statut === 'neuf') S.courant = null;
    sauver(); rendre(); return;
  }
  if (d.serie){
    const p = d.serie.split('|'), c = CHAP[p[0]];
    const pool = p[1] === 'mixte' ? c.gens : c.gens.filter(g => g.niveau === p[1]);
    lancerSerie(pool, 8, 'chapitre', c.titre + (p[1] === 'mixte' ? '' : ' · ' + NIVEAUX[p[1]]));
    return;
  }
  if (d.choix !== undefined){ if (!serie.valide){ serie.q.choix = +d.choix; rendre(); } return; }
  if (d.champ !== undefined){
    if (!serie.valide){ lireChamps(); serie.q.champs[+d.champ].saisie = +d.val; rendre(); }
    return;
  }
  if (d.corrige){ serie.valide = true; rendre(); return; }
  if (d.coched !== undefined){
    const j = +d.coched;
    serie.q.coches[j] = !serie.q.coches[j];
    rendre();
    return;
  }
  if (d.autoeval){ validerAutoEval(); return; }
  if (d.eval){ lancerEvaluation(); return; }
  if (d.dsq !== undefined){ allerQuestion(+d.dsq); return; }
  if (d.dschoix !== undefined){ lireReponsesDS(); dsEnCours.questions[dsEnCours.idx].choix = +d.dschoix; rendre(); return; }
  if (d.dschamp !== undefined){ lireReponsesDS(); dsEnCours.questions[dsEnCours.idx].champs[+d.dschamp].saisie = +d.val; rendre(); return; }
  if (d.dsrendre){ rendreCopie(); return; }
  if (d.coche !== undefined){
    const p = d.coche.split('-');
    const q = dsEnCours.questions[+p[0]];
    q.coches[+p[1]] = !q.coches[+p[1]];
    rendre();
    return;
  }
  if (d.noter){ calculerNote(); return; }
  if (d.verifier){ verifier(false); return; }
  if (d.sechapper){ verifier(true); return; }
  if (d.suivante){ suivante(); return; }
  if (d.quitter){ clearInterval(tickChrono); aller({ nom: 'bilan' }); return; }
  if (d.refaire){
    const pool = serie.mode === 'chapitre' ? serie.gens.slice() : poolRevision();
    lancerSerie(pool, serie.gens.length, serie.mode, serie.titre, serie.mode === 'chrono' ? 900 : 0);
    return;
  }
});
document.addEventListener('keydown', function(e){
  if (e.key !== 'Enter' || vue.nom !== 'serie' || !serie || serie.q.bareme) return;
  e.preventDefault();
  if (serie.valide) suivante(); else verifier(false);
});

/* auto-évaluation d'une démonstration : la note vient du barème coché */
function validerAutoEval(){
  const q = serie.q;
  const tot = q.bareme.reduce((t, b) => t + b.pts, 0);
  const eus = q.bareme.reduce((t, b, j) => t + (q.coches[j] ? b.pts : 0), 0);
  const part = tot ? eus / tot : 0;
  serie.note = eus;
  serie.noteTot = tot;
  serie.juste = part >= 0.7;
  serie.resultats[serie.idx] = serie.juste;
  const r = enregistrer(q.gen.id, serie.juste, part);
  serie.gain = r.gain;
  serie.gains = (serie.gains || 0) + r.gain;
  bip(serie.juste ? 'juste' : 'faux');
  rendre();
  const gagnes = nouveauxBadges({});
  if (gagnes.length) feterBadges(gagnes);
}

rendre();
initStore();
</script>
