<title>Lisa</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Spectral:ital,wght@0,400;0,600;0,700;1,400;1,600&family=Karla:wght@400;500;600;700&family=JetBrains+Mono:wght@400;700&display=swap">
<style>
/* ---------- tokens ---------- */
:root{
  --serif:"Spectral", Georgia, "Times New Roman", serif;
  --sans:"Karla", "Segoe UI", system-ui, sans-serif;
  --mono:"JetBrains Mono", Consolas, monospace;

  --paper:#EDF0F5;
  --surface:#FFFFFF;
  --surface-2:#F5F7FB;
  --surface-3:#E7ECF4;
  --ink:#16223F;
  --ink-2:#525F7E;
  --ink-3:#8590A8;
  --line:#D8DFEA;
  --line-soft:#E6EBF3;

  --accent:#2F45C5;
  --accent-soft:#E6E9FA;
  --accent-ink:#2536A0;

  --amber:#A8710A;
  --amber-soft:#FBEFD8;
  --juste:#0F7A54;
  --juste-soft:#DDF1E8;
  --faux:#B02F28;
  --faux-soft:#FAE4E2;

  --grid:rgba(47,69,197,.07);
  --shadow:0 1px 2px rgba(22,34,63,.05), 0 8px 24px -12px rgba(22,34,63,.18);
  --r:10px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#0E1424;
    --surface:#161E33;
    --surface-2:#1C2540;
    --surface-3:#26304E;
    --ink:#E6EBF6;
    --ink-2:#A3AFC9;
    --ink-3:#7A87A4;
    --line:#2E3958;
    --line-soft:#232C47;
    --accent:#8296FF;
    --accent-soft:#232F63;
    --accent-ink:#A9B7FF;
    --amber:#E0A84B;
    --amber-soft:#3A2D14;
    --juste:#54C79A;
    --juste-soft:#123529;
    --faux:#F08A82;
    --faux-soft:#3A1C1A;
    --grid:rgba(130,150,255,.08);
    --shadow:0 1px 2px rgba(0,0,0,.3), 0 10px 30px -14px rgba(0,0,0,.7);
  }
}
:root[data-theme="dark"]{
  --paper:#0E1424; --surface:#161E33; --surface-2:#1C2540; --surface-3:#26304E;
  --ink:#E6EBF6; --ink-2:#A3AFC9; --ink-3:#7A87A4; --line:#2E3958; --line-soft:#232C47;
  --accent:#8296FF; --accent-soft:#232F63; --accent-ink:#A9B7FF;
  --amber:#E0A84B; --amber-soft:#3A2D14; --juste:#54C79A; --juste-soft:#123529;
  --faux:#F08A82; --faux-soft:#3A1C1A; --grid:rgba(130,150,255,.08);
  --shadow:0 1px 2px rgba(0,0,0,.3), 0 10px 30px -14px rgba(0,0,0,.7);
}

*,*::before,*::after{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font-family:var(--sans);line-height:1.55;-webkit-font-smoothing:antialiased}
h1,h2,h3,h4{font-family:var(--serif);font-weight:600;line-height:1.22;text-wrap:balance;margin:0}
p{margin:0}
button{font:inherit;color:inherit;cursor:pointer;border:none;background:none}
input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}

/* ---------- notation mathématique ---------- */
.m{font-family:var(--serif);font-size:1.06em}
.m i{font-style:italic}
.frac{display:inline-flex;flex-direction:column;vertical-align:-0.45em;text-align:center;font-size:.9em;line-height:1.18}
.frac>.n{padding:0 .3em;border-bottom:1px solid currentColor}
.frac>.d{padding:0 .3em}
.sqrt>.rad{border-top:1px solid currentColor;padding:0 .15em 0 .06em;margin-left:-.06em}
.vec{position:relative;display:inline-block}
.vec>.arw{position:absolute;top:-.8em;left:0;right:0;font-size:.6em;text-align:center;font-style:normal;line-height:1}
code,.code{font-family:var(--mono);font-size:.88em}
pre.code{background:var(--surface-2);border:1px solid var(--line-soft);border-radius:var(--r);padding:14px 16px;overflow-x:auto;line-height:1.6;margin:0}

/* ---------- structure ---------- */
.app{display:grid;grid-template-columns:272px minmax(0,1fr);min-height:100vh}
.side{background:var(--surface);border-right:1px solid var(--line);display:flex;flex-direction:column;position:sticky;top:0;height:100vh;overflow-y:auto}
.brand{padding:20px 20px 16px;border-bottom:1px solid var(--line-soft);
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:22px 22px}
.brand h1{font-size:19px;letter-spacing:-.01em}
.brand .sub{font-size:11px;color:var(--ink-3);text-transform:uppercase;letter-spacing:.09em;font-weight:700;margin-top:4px}
.nav{padding:8px 10px 28px;display:flex;flex-direction:column;gap:2px}
.nav .grp{font-size:10.5px;text-transform:uppercase;letter-spacing:.1em;color:var(--ink-3);font-weight:700;padding:16px 10px 6px}
.nav button{display:flex;align-items:center;gap:9px;width:100%;text-align:left;padding:7px 10px;border-radius:7px;font-size:14px;color:var(--ink-2);transition:background .12s,color .12s}
.nav button:hover{background:var(--surface-2);color:var(--ink)}
.nav button.on{background:var(--accent-soft);color:var(--accent-ink);font-weight:600}
.nav .dot{width:7px;height:7px;border-radius:50%;flex:0 0 auto;background:transparent;border:1.5px solid var(--line)}
.nav .dot.vu{background:var(--amber);border-color:var(--amber)}
.nav .dot.fini{background:var(--juste);border-color:var(--juste)}
.nav .meta{margin-left:auto;font-size:11px;color:var(--ink-3);font-variant-numeric:tabular-nums;flex:0 0 auto}
main{min-width:0;padding-block:34px;padding-left:40px;padding-right:40px;max-width:1080px;width:100%}
.topbar{display:none}

@media (max-width:900px){
  .app{grid-template-columns:1fr}
  .side{position:fixed;inset:0 auto 0 0;width:min(300px,86vw);z-index:40;transform:translateX(-102%);transition:transform .22s ease;box-shadow:var(--shadow)}
  .side.open{transform:none}
  .scrim{position:fixed;inset:0;background:rgba(10,15,30,.45);z-index:35}
  .topbar{display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:20;background:var(--surface);border-bottom:1px solid var(--line);padding:10px 16px}
  .topbar h1{font-size:16px}
  main{padding-left:16px;padding-right:16px;padding-block:22px}
}

/* ---------- éléments ---------- */
.eyebrow{font-size:11px;text-transform:uppercase;letter-spacing:.12em;font-weight:700;color:var(--accent);margin-bottom:8px}
.lede{color:var(--ink-2);font-size:15px;max-width:64ch}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:10px 18px;border-radius:8px;font-weight:600;font-size:14.5px;background:var(--surface-2);border:1px solid var(--line);transition:background .12s,border-color .12s,transform .08s}
.btn:hover{background:var(--surface-3)}
.btn:active{transform:translateY(1px)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.primary:hover{filter:brightness(1.08)}
:root[data-theme="dark"] .btn.primary{color:#0E1424}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .btn.primary{color:#0E1424}}
.btn.ghost{background:transparent}
.btn.sm{padding:6px 12px;font-size:13px;border-radius:7px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:11px;font-weight:700;letter-spacing:.05em;padding:3px 9px;border-radius:999px;text-transform:uppercase}
.pill.neuf{background:var(--surface-3);color:var(--ink-2)}
.pill.vu{background:var(--amber-soft);color:var(--amber)}
.pill.fini{background:var(--juste-soft);color:var(--juste)}
.pill.soon{background:var(--surface-3);color:var(--ink-3)}
.bar{height:5px;border-radius:999px;background:var(--surface-3);overflow:hidden}
.bar>span{display:block;height:100%;background:var(--accent);border-radius:999px;transition:width .3s}
.bar.g>span{background:var(--juste)}
.mut{color:var(--ink-2)}
.tiny{font-size:12.5px;color:var(--ink-3)}

/* ---------- accueil ---------- */
.home-head{display:flex;flex-wrap:wrap;gap:20px;align-items:flex-end;justify-content:space-between;margin-bottom:26px}
.encours{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:18px;align-items:center;background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--accent);border-radius:var(--r);padding:18px 20px;margin-bottom:14px}
.modes{display:grid;grid-template-columns:repeat(auto-fit,minmax(215px,1fr));gap:12px;margin-bottom:30px}
.mode{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;text-align:left;display:flex;flex-direction:column;gap:5px;transition:border-color .12s,transform .1s}
.mode:hover{border-color:var(--accent);transform:translateY(-1px)}
.mode b{font-family:var(--serif);font-size:16.5px;font-weight:600}
.mode span{font-size:13px;color:var(--ink-2);line-height:1.45}
.mode[disabled]{opacity:.5}
.mode[disabled]:hover{border-color:var(--line);transform:none}
.blocs{display:flex;flex-direction:column;gap:26px}
.bloc h3{font-size:13px;text-transform:uppercase;letter-spacing:.1em;color:var(--ink-3);font-family:var(--sans);font-weight:700;margin-bottom:10px;padding-bottom:8px;border-bottom:1px solid var(--line)}
.chaps{display:grid;grid-template-columns:repeat(auto-fill,minmax(258px,1fr));gap:10px}
.chap{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;text-align:left;display:flex;flex-direction:column;gap:9px;transition:border-color .12s,transform .1s}
.chap:hover{border-color:var(--accent);transform:translateY(-1px)}
.chap .t{font-family:var(--serif);font-size:16px;font-weight:600;line-height:1.25}
.chap .row{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:auto}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;margin-bottom:26px}
.stat{background:var(--surface);padding:14px 16px}
.stat .v{font-family:var(--serif);font-size:26px;font-weight:600;font-variant-numeric:tabular-nums;line-height:1.1}
.stat .k{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--ink-3);font-weight:700;margin-top:2px}

/* ---------- chapitre ---------- */
.chead{margin-bottom:22px}
.chead h2{font-size:29px;margin:6px 0 10px}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:22px;overflow-x:auto}
.tabs button{padding:9px 14px;font-size:14px;font-weight:600;color:var(--ink-3);border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap}
.tabs button.on{color:var(--accent);border-bottom-color:var(--accent)}
.capa{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px 20px;margin-bottom:18px}
.capa ul{margin:10px 0 0;padding-left:20px;display:flex;flex-direction:column;gap:6px;font-size:14.5px;color:var(--ink-2)}
.cours{display:flex;flex-direction:column;gap:14px}
.blk{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px}
.blk.def{border-left:3px solid var(--accent)}
.blk.prop{border-left:3px solid var(--juste)}
.blk.meth{border-left:3px solid var(--amber)}
.blk.piege{border-left:3px solid var(--faux);background:var(--surface)}
.blk .h{display:flex;align-items:center;gap:9px;margin-bottom:8px}
.blk .h .k{font-size:10.5px;text-transform:uppercase;letter-spacing:.1em;font-weight:700}
.blk.def .h .k{color:var(--accent)} .blk.prop .h .k{color:var(--juste)}
.blk.meth .h .k{color:var(--amber)} .blk.piege .h .k{color:var(--faux)}
.blk .h b{font-family:var(--serif);font-size:16.5px;font-weight:600}
.blk .body{font-size:14.8px;color:var(--ink-2);display:flex;flex-direction:column;gap:9px}
.blk .body b,.blk .body strong{color:var(--ink)}
.blk .body ul{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:5px}
.center{text-align:center;color:var(--ink);padding:4px 0}
.niveaux{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.niv{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;text-align:left;display:flex;flex-direction:column;gap:4px}
.niv:hover{border-color:var(--accent)}
.niv b{font-family:var(--serif);font-size:16px;font-weight:600}
.niv span{font-size:12.5px;color:var(--ink-2)}
.methods{display:flex;flex-direction:column;gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.mrow{display:grid;grid-template-columns:minmax(0,1fr) 92px 68px;gap:12px;align-items:center;background:var(--surface);padding:11px 16px;font-size:14px}
.mrow .lbl{min-width:0}
.mrow .sc{font-variant-numeric:tabular-nums;font-size:13px;color:var(--ink-2);text-align:right}

/* ---------- exercices ---------- */
.run{max-width:760px;margin:0 auto}
.runtop{display:flex;align-items:center;justify-content:space-between;gap:14px;margin-bottom:18px}
.dots{display:flex;gap:5px;flex-wrap:wrap}
.dots i{width:9px;height:9px;border-radius:50%;background:var(--surface-3);border:1px solid var(--line);display:block}
.dots i.ok{background:var(--juste);border-color:var(--juste)}
.dots i.ko{background:var(--faux);border-color:var(--faux)}
.dots i.now{background:var(--accent);border-color:var(--accent);transform:scale(1.25)}
.qcard{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:24px;box-shadow:var(--shadow)}
.qmeta{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.qtext{font-size:17px;line-height:1.6;display:flex;flex-direction:column;gap:10px}
.qtext .m{font-size:1.12em}
.fields{display:flex;flex-direction:column;gap:12px;margin-top:20px}
.field{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.field label{font-size:14.5px;color:var(--ink-2);min-width:140px}
.field input{padding:9px 12px;border:1px solid var(--line);border-radius:8px;background:var(--surface-2);width:150px;font-size:15px;font-variant-numeric:tabular-nums}
.field input:focus{outline:2px solid var(--accent);outline-offset:0;border-color:var(--accent)}
.choices{display:flex;flex-direction:column;gap:8px;margin-top:18px}
.choice{display:flex;align-items:center;gap:11px;padding:12px 14px;border:1px solid var(--line);border-radius:8px;background:var(--surface-2);text-align:left;font-size:15px;transition:border-color .1s,background .1s}
.choice:hover{border-color:var(--accent)}
.choice.sel{border-color:var(--accent);background:var(--accent-soft)}
.choice .k{width:22px;height:22px;flex:0 0 auto;border-radius:50%;border:1px solid var(--line);display:grid;place-items:center;font-size:12px;font-weight:700;color:var(--ink-3);background:var(--surface)}
.choice.sel .k{background:var(--accent);border-color:var(--accent);color:#fff}
.choice.good{border-color:var(--juste);background:var(--juste-soft)}
.choice.bad{border-color:var(--faux);background:var(--faux-soft)}
.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:22px}
.verdict{margin-top:20px;border-radius:var(--r);padding:16px 18px;border:1px solid}
.verdict.ok{background:var(--juste-soft);border-color:var(--juste)}
.verdict.ko{background:var(--faux-soft);border-color:var(--faux)}
.verdict .vh{font-family:var(--serif);font-size:17px;font-weight:600;display:flex;align-items:center;gap:8px}
.verdict.ok .vh{color:var(--juste)} .verdict.ko .vh{color:var(--faux)}
.verdict .vb{margin-top:6px;font-size:14.5px;color:var(--ink-2)}
.sol{margin-top:16px;background:var(--surface-2);border:1px solid var(--line-soft);border-radius:var(--r);padding:18px}
.sol h4{font-size:12px;text-transform:uppercase;letter-spacing:.1em;color:var(--ink-3);font-family:var(--sans);font-weight:700;margin-bottom:12px}
.steps{display:flex;flex-direction:column;gap:12px;counter-reset:st}
.step{display:grid;grid-template-columns:24px minmax(0,1fr);gap:11px;font-size:14.8px;color:var(--ink-2);line-height:1.6}
.step::before{counter-increment:st;content:counter(st);width:24px;height:24px;border-radius:50%;background:var(--surface-3);color:var(--ink-3);font-size:11.5px;font-weight:700;display:grid;place-items:center;font-family:var(--sans)}
.step .m{color:var(--ink);font-size:1.08em}
.step b{color:var(--ink)}
.bilan{text-align:center;padding:34px 24px}
.bilan .score{font-family:var(--serif);font-size:56px;font-weight:600;line-height:1;font-variant-numeric:tabular-nums}
.bilan .sur{font-size:24px;color:var(--ink-3)}
.timer{font-variant-numeric:tabular-nums;font-weight:700;font-size:15px;padding:5px 11px;border-radius:7px;background:var(--surface-3)}
.timer.warn{background:var(--faux-soft);color:var(--faux)}
.empty{text-align:center;padding:44px 20px;color:var(--ink-2);background:var(--surface);border:1px dashed var(--line);border-radius:var(--r)}
.revue{display:flex;flex-direction:column;gap:8px}
.rev{display:flex;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--line);border-left:3px solid var(--amber);border-radius:var(--r);padding:12px 16px;font-size:14.5px}
.rev .ch{font-size:12px;color:var(--ink-3);margin-left:auto;white-space:nowrap}
/* ---------- une couleur par domaine ---------- */
[data-bloc]{--bc:var(--accent);--bcs:var(--accent-soft)}
[data-bloc="algebre"]   {--bc:#6D4AC9;--bcs:#EEE8FC}
[data-bloc="analyse"]   {--bc:#2F6FE0;--bcs:#E4EDFC}
[data-bloc="geometrie"] {--bc:#0F8A5F;--bcs:#DDF2EA}
[data-bloc="probas"]    {--bc:#C4700A;--bcs:#FBEEDA}
[data-bloc="transverse"]{--bc:#BC3B84;--bcs:#FBE5F1}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]) [data-bloc="algebre"]   {--bc:#B49BFF;--bcs:#2C2350}
  :root:not([data-theme="light"]) [data-bloc="analyse"]   {--bc:#7FB0FF;--bcs:#1B2C4E}
  :root:not([data-theme="light"]) [data-bloc="geometrie"] {--bc:#4FD1A0;--bcs:#12352C}
  :root:not([data-theme="light"]) [data-bloc="probas"]    {--bc:#F0A94C;--bcs:#3A2A12}
  :root:not([data-theme="light"]) [data-bloc="transverse"]{--bc:#F183BC;--bcs:#3B1C30}
}
:root[data-theme="dark"] [data-bloc="algebre"]   {--bc:#B49BFF;--bcs:#2C2350}
:root[data-theme="dark"] [data-bloc="analyse"]   {--bc:#7FB0FF;--bcs:#1B2C4E}
:root[data-theme="dark"] [data-bloc="geometrie"] {--bc:#4FD1A0;--bcs:#12352C}
:root[data-theme="dark"] [data-bloc="probas"]    {--bc:#F0A94C;--bcs:#3A2A12}
:root[data-theme="dark"] [data-bloc="transverse"]{--bc:#F183BC;--bcs:#3B1C30}

.nav .grp[data-bloc]{color:var(--bc)}
.bloc[data-bloc] h3{color:var(--bc);border-bottom-color:var(--bc);border-bottom-width:2px}
.chap[data-bloc]{border-top:3px solid var(--bc)}
.chap[data-bloc]:hover{border-color:var(--line);border-top-color:var(--bc);box-shadow:0 6px 18px -10px var(--bc)}
.chead[data-bloc] .eyebrow{color:var(--bc)}
.chead[data-bloc] h2{color:var(--bc)}
.qcard[data-bloc]{border-top:4px solid var(--bc)}
.qcard[data-bloc] .pill.neuf{background:var(--bcs);color:var(--bc)}
.chap-rank .niv-dots i.on{background:var(--bc)}
.nav button[data-bloc] .dot.fini{background:var(--bc);border-color:var(--bc)}

/* ---------- ruban des matières ---------- */
.ruban{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;margin-bottom:22px;scrollbar-width:thin}
.mat{display:flex;align-items:center;gap:7px;flex:0 0 auto;padding:8px 14px;border-radius:999px;
  border:1px solid var(--line);background:var(--surface);font-size:13.5px;color:var(--ink-2);transition:all .12s}
.mat:hover{border-color:var(--accent);color:var(--ink)}
.mat b{font-weight:600}
.mat .me{font-size:16px;line-height:1}
.mat.on{background:var(--accent);border-color:var(--accent);color:#fff}
:root[data-theme="dark"] .mat.on{color:#0E1424}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .mat.on{color:#0E1424}}
.mat.futur{opacity:.6}
.mat .mb{font-size:9.5px;text-transform:uppercase;letter-spacing:.07em;font-weight:700;color:var(--amber);
  background:var(--amber-soft);padding:2px 6px;border-radius:999px}
